name: QuantMind 部署测试

on:
  workflow_dispatch:

jobs:
  quantmind:
    runs-on: ubuntu-22.04

    timeout-minutes: 180

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: 1. Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. 系统环境检查
      # =========================================================
      - name: 2. 系统环境检查
        run: |
          echo "========================================================="
          echo "系统环境检查"
          echo "========================================================="

          echo
          echo "操作系统："
          uname -a

          echo
          echo "Docker："
          docker --version

          echo
          echo "Docker Compose："
          docker compose version

          echo
          echo "磁盘空间："
          df -h

          echo
          echo "内存："
          free -h

      # =========================================================
      # 3. 执行作者官方完整部署
      # =========================================================
      - name: 3. 执行 QuantMind 官方完整部署
        run: |
          echo "========================================================="
          echo "开始执行 QuantMind 官方 full-deploy.sh"
          echo "========================================================="

          sudo bash deploy/full-deploy.sh

      # =========================================================
      # 4. 查看 Docker 服务状态
      # =========================================================
      - name: 4. 查看 Docker 服务状态
        run: |
          echo "========================================================="
          echo "QuantMind Docker 服务状态"
          echo "========================================================="

          cd /opt/quantmind

          docker compose ps

      # =========================================================
      # 5. 等待 QuantMind API 健康
      # =========================================================
      - name: 5. 等待 QuantMind API 健康
        run: |
          echo "========================================================="
          echo "等待 QuantMind API 启动"
          echo "========================================================="

          for i in {1..60}; do

            echo
            echo "第 $i 次检查..."

            if curl -s --fail \
              http://127.0.0.1:8000/health \
              > /tmp/quantmind_health.json
            then

              echo "QuantMind API 已正常启动"

              cat /tmp/quantmind_health.json

              exit 0
            fi

            sleep 5

          done

          echo "QuantMind API 启动失败"

          cd /opt/quantmind

          docker compose ps

          exit 1

      # =========================================================
      # 5.1 OpenAPI 检查
      # =========================================================
      - name: 5.1 OpenAPI 检查
        run: |
          echo "========================================================="
          echo "检查 QuantMind OpenAPI"
          echo "========================================================="

          curl -s --fail \
            http://127.0.0.1:8000/openapi.json \
            -o /tmp/openapi.json

          echo
          echo "OpenAPI 文件大小："
          wc -c /tmp/openapi.json

          echo
          echo "API 总数量："

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          print(len(paths))
          PY

      # =========================================================
      # 5.2 查找推理相关接口
      # =========================================================
      - name: 5.2 查找推理相关接口
        run: |
          echo "========================================================="
          echo "查找 QuantMind 推理相关 API"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          keywords = [
              "inference",
              "predict",
              "signal",
              "model",
              "stock-terminal"
          ]

          for path, methods in paths.items():

              path_lower = path.lower()

              if any(k in path_lower for k in keywords):

                  for method, info in methods.items():

                      if method.lower() in {
                          "get",
                          "post",
                          "put",
                          "patch"
                      }:

                          print(
                              f"{method.upper():6} "
                              f"{path} "
                              f"-> "
                              f"{info.get('summary', '')}"
                          )
          PY

      # =========================================================
      # 5.3 检查推理前置接口
      # =========================================================
      - name: 5.3 检查推理前置接口
        run: |
          echo "========================================================="
          echo "检查 QuantMind 推理前置接口"
          echo "========================================================="

          echo
          echo "GET /api/v1/admin/models/precheck-inference"
          echo

          curl -i \
            http://127.0.0.1:8000/api/v1/admin/models/precheck-inference \
            || true

          echo
          echo "========================================================="
          echo "推理前置检查完成"
          echo "========================================================="

      # =========================================================
      # 5.4 查看 InferenceRunRequest / BatchInferenceRequest
      # =========================================================
      - name: 5.4 查看推理请求参数结构
        run: |
          echo "========================================================="
          echo "查看 InferenceRunRequest / BatchInferenceRequest"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          schemas = (
              data
              .get("components", {})
              .get("schemas", {})
          )

          for name in [
              "InferenceRunRequest",
              "BatchInferenceRequest"
          ]:

              print()
              print("=" * 60)
              print(name)
              print("=" * 60)

              schema = schemas.get(name)

              if schema:
                  print(
                      json.dumps(
                          schema,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
              else:
                  print("未找到该 Schema")
          PY

      # =========================================================
      # 5.5 查找可能触发推理的 POST / PUT / PATCH
      # =========================================================
      - name: 5.5 查找可能的推理触发接口
        run: |
          echo "========================================================="
          echo "查找可能的推理触发接口"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          keywords = [
              "inference",
              "predict",
              "signal",
              "training",
              "backfill"
          ]

          for path, methods in paths.items():

              path_lower = path.lower()

              if any(k in path_lower for k in keywords):

                  for method, info in methods.items():

                      method_upper = method.upper()

                      if method_upper in {
                          "POST",
                          "PUT",
                          "PATCH"
                      }:

                          print()
                          print(
                              f"{method_upper} {path}"
                          )

                          print(
                              "Summary:",
                              info.get(
                                  "summary",
                                  ""
                              )
                          )

                          description = (
                              info.get(
                                  "description",
                                  ""
                              )
                              or ""
                          )

                          if description:
                              print(
                                  "Description:",
                                  description[:1000]
                              )
          PY

      # =========================================================
      # 5.6 查询当前默认模型
      # =========================================================
      - name: 5.6 查询当前默认模型
        run: |
          echo "========================================================="
          echo "查询 QuantMind 当前默认模型"
          echo "========================================================="

          echo
          echo "GET /api/v1/models/default"
          echo

          curl -i \
            http://127.0.0.1:8000/api/v1/models/default \
            || true

          echo
          echo "========================================================="
          echo "默认模型原始返回内容"
          echo "========================================================="

      # =========================================================
      # 5.6A 查找认证 / 登录接口
      # =========================================================
      - name: 5.6A 查找认证登录接口
        run: |
          echo "========================================================="
          echo "查找 QuantMind 认证 / 登录接口"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          keywords = [
              "auth",
              "login",
              "token",
              "session",
              "oauth",
              "me"
          ]

          found = 0

          for path, methods in paths.items():

              path_lower = path.lower()

              if any(k in path_lower for k in keywords):

                  for method, info in methods.items():

                      method_upper = method.upper()

                      if method_upper in {
                          "GET",
                          "POST",
                          "PUT",
                          "PATCH"
                      }:

                          found += 1

                          print()
                          print("=" * 70)
                          print(
                              f"{method_upper} {path}"
                          )

                          print(
                              "Summary:",
                              info.get(
                                  "summary",
                                  ""
                              )
                          )

                          description = (
                              info.get(
                                  "description",
                                  ""
                              )
                              or ""
                          )

                          if description:
                              print(
                                  "Description:",
                                  description[:1500]
                              )

                          parameters = (
                              info.get(
                                  "parameters",
                                  []
                              )
                          )

                          if parameters:
                              print("Parameters:")

                              for parameter in parameters:

                                  print(
                                      "  -",
                                      parameter.get(
                                          "name",
                                          ""
                                      ),
                                      parameter.get(
                                          "in",
                                          ""
                                      ),
                                      parameter.get(
                                          "required",
                                          False
                                      )
                                  )

                          request_body = info.get(
                              "requestBody"
                          )

                          if request_body:

                              print(
                                  "Request Body:"
                              )

                              print(
                                  json.dumps(
                                      request_body,
                                      ensure_ascii=False,
                                      indent=2
                                  )[:4000]
                              )

          print()
          print("=" * 70)

          if found == 0:
              print("没有找到明显的认证 / 登录接口")

          else:
              print(
                  f"共找到 {found} 个可能的认证相关接口"
              )

          print("=" * 70)
          PY

          echo
          echo "========================================================="
          echo "认证接口搜索完成"
          echo "========================================================="

      # =========================================================
      # 5.7 检查用户态推理接口
      # =========================================================
      - name: 5.7 检查用户态推理接口
        run: |
          echo "========================================================="
          echo "检查用户态推理接口"
          echo "========================================================="

          echo
          echo "GET /api/v1/models/inference/precheck"
          echo

          curl -i \
            http://127.0.0.1:8000/api/v1/models/inference/precheck \
            || true

          echo
          echo "========================================================="
          echo "用户态推理接口检查完成"
          echo "========================================================="

      # =========================================================
      # 5.8 检查股票终端接口
      # =========================================================
      - name: 5.8 检查股票终端接口
      - name: 5.8 检查股票终端接口
        run: |
          echo "========================================================="
          echo "检查股票终端接口"
          echo "========================================================="

          echo
          echo "GET /api/v1/stock-terminal/list"
          echo

          curl -i \
            "http://127.0.0.1:8000/api/v1/stock-terminal/list?page=1&page_size=5" \
            || true

          echo
          echo "========================================================="
          echo "股票终端接口检查完成"
          echo "========================================================="

      # =========================================================
      # 5.9 检查市场日历
      # =========================================================
      - name: 5.9 检查市场日历
        run: |
          echo "========================================================="
          echo "检查 QuantMind 市场日历"
          echo "========================================================="

          echo
          echo "GET /api/v1/stock-terminal/market-calendar"
          echo

          curl -i \
            "http://127.0.0.1:8000/api/v1/stock-terminal/market-calendar?months=1" \
            || true

          echo
          echo "========================================================="
          echo "市场日历检查完成"
          echo "========================================================="

      # =========================================================
      # 6. 查看 Docker 最终状态
      # =========================================================
      - name: 6. 查看 Docker 最终状态
        if: always()
        run: |
          echo "========================================================="
          echo "QuantMind Docker 最终状态"
          echo "========================================================="

          cd /opt/quantmind

          docker compose ps

      # =========================================================
      # 7. 查看 QuantMind 日志
      # =========================================================
      - name: 7. 查看 QuantMind 日志
        if: always()
        run: |
          echo "========================================================="
          echo "QuantMind 日志"
          echo "========================================================="

          cd /opt/quantmind

          docker compose logs --tail=200 quantmind || true

      # =========================================================
      # 8. 查看 Celery 日志
      # =========================================================
      - name: 8. 查看 Celery 日志
        if: always()
        run: |
          echo "========================================================="
          echo "Celery 日志"
          echo "========================================================="

          cd /opt/quantmind

          docker compose logs --tail=100 quantmind-celery || true

      # =========================================================
      # 9. 查看 Celery Beat 日志
      # =========================================================
      - name: 9. 查看 Celery Beat 日志
        if: always()
        run: |
          echo "========================================================="
          echo "Celery Beat 日志"
          echo "========================================================="

          cd /opt/quantmind

          docker compose logs --tail=100 quantmind-celery-beat || true

      # =========================================================
      # 10. 关闭 QuantMind
      # =========================================================
      - name: 10. 关闭 QuantMind
        if: always()
        run: |
          echo "========================================================="
          echo "关闭 QuantMind Docker 服务"
          echo "========================================================="

          cd /opt/quantmind

          docker compose down

          echo
          echo "========================================================="
          echo "QuantMind 本次测试完成"
          echo "========================================================="
