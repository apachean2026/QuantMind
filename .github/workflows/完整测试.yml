name: QuantMind 每日自动选股

on:
  workflow_dispatch:

  schedule:
    # 北京时间周一至周五 15:30
    # GitHub Actions 使用 UTC
    # 北京时间 = UTC + 8
    - cron: "30 7 * * 1-5"

jobs:

  quantmind:
    runs-on: ubuntu-22.04

    env:
      QUANTMIND_TENANT_ID: ${{ secrets.QUANTMIND_TENANT_ID }}
      QUANTMIND_USERNAME: ${{ secrets.QUANTMIND_USERNAME }}
      QUANTMIND_PASSWORD: ${{ secrets.QUANTMIND_PASSWORD }}
      QUANTMIND_URL: http://127.0.0.1:8000

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. 基础环境
      # =========================================================
      - name: 检查运行环境
        run: |
          echo "========================================================="
          echo "QuantMind 自动选股"
          echo "========================================================="

          echo ""
          echo "系统："
          uname -a

          echo ""
          echo "Docker："
          docker --version

          echo ""
          echo "磁盘空间："
          df -h


      # =========================================================
      # 3. Secrets
      # =========================================================
      - name: 检查 QuantMind Secrets
        run: |
          echo "========================================================="
          echo "检查 Secrets"
          echo "========================================================="

          if [ -z "$QUANTMIND_TENANT_ID" ]; then
            echo "❌ QUANTMIND_TENANT_ID 未配置"
            exit 1
          fi

          if [ -z "$QUANTMIND_USERNAME" ]; then
            echo "❌ QUANTMIND_USERNAME 未配置"
            exit 1
          fi

          if [ -z "$QUANTMIND_PASSWORD" ]; then
            echo "❌ QUANTMIND_PASSWORD 未配置"
            exit 1
          fi

          echo "✅ QUANTMIND_TENANT_ID 已配置"
          echo "✅ QUANTMIND_USERNAME 已配置"
          echo "✅ QUANTMIND_PASSWORD 已配置"


      # =========================================================
      # 4. 启动 QuantMind
      # =========================================================
      - name: 部署并启动 QuantMind
        run: |
          echo "========================================================="
          echo "启动 QuantMind"
          echo "========================================================="

          if [ ! -f deploy/full-deploy.sh ]; then
            echo "❌ 找不到 deploy/full-deploy.sh"
            pwd
            ls -lah
            exit 1
          fi

          sudo bash deploy/full-deploy.sh


      # =========================================================
      # 5. Docker 状态
      # =========================================================
      - name: 检查 Docker 容器
        run: |
          echo "========================================================="
          echo "Docker 容器状态"
          echo "========================================================="

          docker ps -a

          echo ""
          echo "精确检查 QuantMind 主容器："

          if docker inspect quantmind >/dev/null 2>&1; then
            docker inspect quantmind \
              --format '容器名称={{.Name}} 状态={{.State.Status}} 健康={{if .State.Health}}{{.State.Health.Status}}{{else}}无healthcheck{{end}}'
          else
            echo "❌ 找不到 quantmind 容器"
            exit 1
          fi


      # =========================================================
      # 6. 等待 QuantMind HTTP
      # =========================================================
      - name: 等待 QuantMind 服务
        run: |
          echo "========================================================="
          echo "等待 QuantMind HTTP 服务"
          echo "========================================================="

          for i in $(seq 1 60); do

            HTTP_CODE=$(curl -s \
              -o /tmp/quantmind_health.json \
              -w "%{http_code}" \
              "$QUANTMIND_URL/health" || true)

            echo "第 $i/60 次检查，HTTP：$HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ QuantMind 已启动"

              echo ""
              cat /tmp/quantmind_health.json || true

              break
            fi

            if [ "$i" = "60" ]; then
              echo "❌ QuantMind 启动超时"
              docker ps -a
              exit 1
            fi

            sleep 5
          done


      # =========================================================
      # 7. 精确检查 QuantMind 数据挂载
      # =========================================================
      - name: 检查 QuantMind 数据挂载
        run: |
          echo "========================================================="
          echo "检查 QuantMind 数据挂载"
          echo "========================================================="

          echo ""
          echo "【1】QuantMind 主容器 Mounts"

          docker inspect quantmind \
            --format '{{range .Mounts}}{{println "TYPE=" .Type "SOURCE=" .Source "DEST=" .Destination "RW=" .RW}}{{end}}'

          echo ""
          echo "【2】QuantMind 容器 /data"

          docker exec quantmind sh -c '
            echo "--- /data ---"
            ls -lah /data 2>&1 || true

            echo ""
            echo "--- /data/quantdb ---"
            ls -lah /data/quantdb 2>&1 || true
          '

          echo ""
          echo "【3】QuantMind 容器 QuantDB 文件"

          docker exec quantmind sh -c '
            if [ -d /data/quantdb ]; then
              echo "QuantDB 目录存在"

              find /data/quantdb \
                -maxdepth 4 \
                -type f \
                2>/dev/null \
                | head -200
            else
              echo "❌ /data/quantdb 不存在"
            fi
          '

          echo ""
          echo "【4】宿主机标准目录"

          sudo ls -lah /opt/quantmind || true
          sudo ls -lah /opt/quantmind/data || true
          sudo ls -lah /opt/quantmind/data/quantdb || true


      # =========================================================
      # 8. 登录
      # =========================================================
      - name: 登录 QuantMind
        run: |
          echo "========================================================="
          echo "QuantMind 登录"
          echo "========================================================="

          python3 - <<'PY'
          import json
          import os

          payload = {
              "tenant_id": os.environ["QUANTMIND_TENANT_ID"],
              "username": os.environ["QUANTMIND_USERNAME"],
              "password": os.environ["QUANTMIND_PASSWORD"]
          }

          with open("/tmp/login_payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

          HTTP_CODE=$(curl -s \
            -o /tmp/quantmind_login.json \
            -w "%{http_code}" \
            -X POST \
            "$QUANTMIND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            --data-binary @/tmp/login_payload.json)

          echo "HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 登录失败"
            cat /tmp/quantmind_login.json
            exit 1
          fi

          TOKEN=$(python3 - <<'PY'
          import json

          with open("/tmp/quantmind_login.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          token = (
              data.get("access_token")
              or data.get("token")
              or data.get("data", {}).get("access_token")
              or data.get("data", {}).get("token")
          )

          if not token:
              raise SystemExit("没有找到 access_token")

          print(token)
          PY
          )

          printf '%s' "$TOKEN" > /tmp/quantmind_token.txt

          echo "✅ 登录成功"


      # =========================================================
      # 9. 用户验证
      # =========================================================
      - name: 验证 QuantMind 用户
        run: |
          echo "========================================================="
          echo "验证当前用户"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          HTTP_CODE=$(curl -s \
            -o /tmp/quantmind_me.json \
            -w "%{http_code}" \
            "$QUANTMIND_URL/api/v1/users/me" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

          echo "HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            cat /tmp/quantmind_me.json
            exit 1
          fi

          echo "✅ 用户验证成功"


      # =========================================================
      # 10. QuantDB 官方增量同步
      # =========================================================
      - name: 同步 QuantDB 数据
        run: |
          echo "========================================================="
          echo "同步 QuantDB 数据"
          echo "========================================================="

          echo ""
          echo "检查官方同步脚本："

          docker exec quantmind sh -c '
            if [ -f backend/scripts/quantdb_daily_sync.py ]; then
              echo "✅ 找到 quantdb_daily_sync.py"
            else
              echo "❌ 没有找到 quantdb_daily_sync.py"
            fi
          '

          echo ""
          echo "开始 QuantDB 日常增量同步..."

          if docker exec quantmind \
              test -f backend/scripts/quantdb_daily_sync.py; then

            docker exec quantmind \
              python backend/scripts/quantdb_daily_sync.py

            SYNC_EXIT=$?

            if [ "$SYNC_EXIT" != "0" ]; then
              echo ""
              echo "❌ QuantDB 同步失败"
              exit "$SYNC_EXIT"
            fi

            echo ""
            echo "✅ QuantDB 同步命令执行完成"

          else

            echo ""
            echo "⚠️ 当前镜像没有 quantdb_daily_sync.py"
            echo "暂时跳过同步，继续检查现有数据。"

          fi


      # =========================================================
      # 11. 同步后再次检查 QuantDB
      # =========================================================
      - name: 验证 QuantDB 数据
        run: |
          echo "========================================================="
          echo "验证 QuantDB"
          echo "========================================================="

          echo ""
          echo "【1】QuantDB 目录"

          docker exec quantmind sh -c '
            ls -lah /data/quantdb 2>&1 || true
          '

          echo ""
          echo "【2】QuantDB 文件"

          docker exec quantmind sh -c '
            find /data/quantdb \
              -maxdepth 5 \
              -type f \
              2>/dev/null \
              | head -300 || true
          '

          echo ""
          echo "【3】l1_l2_factors 搜索"

          docker exec quantmind sh -c '
            find /data/quantdb \
              -type f \
              2>/dev/null \
              | grep -Ei "l1_l2_factors|l1.*l2|factors" \
              | head -100 || true
          '


      # =========================================================
      # 12. 获取模型
      # =========================================================
      - name: 获取 QuantMind 模型
        run: |
          echo "========================================================="
          echo "获取模型"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          HTTP_CODE=$(curl -s \
            -o /tmp/quantmind_models.json \
            -w "%{http_code}" \
            "$QUANTMIND_URL/api/v1/models" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

          echo "HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            cat /tmp/quantmind_models.json
            exit 1
          fi

          MODEL_ID=$(python3 - <<'PY'
          import json

          with open("/tmp/quantmind_models.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = []

          if isinstance(data, list):
              items = data

          elif isinstance(data, dict):
              if isinstance(data.get("items"), list):
                  items = data["items"]
              elif isinstance(data.get("data"), list):
                  items = data["data"]
              elif isinstance(data.get("data"), dict):
                  items = data["data"].get("items", [])

          for item in items:
              if not isinstance(item, dict):
                  continue

              model_id = item.get("model_id") or item.get("id")

              if model_id:
                  print(model_id)
                  break
          PY
          )

          if [ -z "$MODEL_ID" ]; then
            echo "❌ 没有找到模型"
            cat /tmp/quantmind_models.json
            exit 1
          fi

          printf '%s' "$MODEL_ID" > /tmp/quantmind_model_id.txt

          echo "MODEL_ID=$MODEL_ID"
          echo "MODEL_ID=$MODEL_ID" >> "$GITHUB_ENV"


      # =========================================================
      # 13. Precheck
      # =========================================================
      - name: QuantMind 推理前置检查
        run: |
          echo "========================================================="
          echo "QuantMind 推理前置检查"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)
          MODEL_ID=$(cat /tmp/quantmind_model_id.txt)

          HTTP_CODE=$(curl -s \
            -o /tmp/quantmind_precheck.json \
            -w "%{http_code}" \
            --get \
            "$QUANTMIND_URL/api/v1/models/inference/precheck" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            --data-urlencode "model_id=$MODEL_ID")

          echo "HTTP 状态码：$HTTP_CODE"

          echo ""
          echo "Precheck 返回："
          cat /tmp/quantmind_precheck.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Precheck API 调用失败"
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("/tmp/quantmind_precheck.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("========== Precheck 项目 ==========")

          for item in data.get("items", []):
              print(
                  f"[{item.get('passed')}] "
                  f"{item.get('key')} - "
                  f"{item.get('label')} - "
                  f"{item.get('detail')}"
              )

          print("")
          print("Precheck passed =", data.get("passed"))

          if data.get("passed") is not True:
              print("")
              print("❌ QuantMind Precheck 仍然没有通过")
              print("")
              print("失败项目：")

              for item in data.get("items", []):
                  if item.get("passed") is False:
                      print(
                          f"❌ {item.get('key')}: "
                          f"{item.get('detail')}"
                      )

              raise SystemExit(1)

          print("")
          print("✅ QuantMind Precheck 已通过")
          PY


      # =========================================================
      # 14. 确定北京时间推理日期
      # =========================================================
      - name: 确定推理日期
        run: |
          echo "========================================================="
          echo "确定推理日期"
          echo "========================================================="

          INFERENCE_DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d')

          echo "北京时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "推理日期：$INFERENCE_DATE"

          printf '%s' "$INFERENCE_DATE" > /tmp/quantmind_inference_date.txt


      # =========================================================
      # 15. 执行模型推理
      # =========================================================
      - name: 执行 QuantMind 模型推理
        run: |
          echo "========================================================="
          echo "执行 QuantMind 模型推理"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)
          MODEL_ID=$(cat /tmp/quantmind_model_id.txt)
          INFERENCE_DATE=$(cat /tmp/quantmind_inference_date.txt)

          python3 - <<PY
          import json

          payload = {
              "model_id": "$MODEL_ID",
              "inference_date": "$INFERENCE_DATE",
              "pool_id": None
          }

          with open("/tmp/inference_request.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)

          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

          HTTP_CODE=$(curl -s \
            -o /tmp/inference_run.json \
            -w "%{http_code}" \
            -X POST \
            "$QUANTMIND_URL/api/v1/models/inference/run" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/inference_request.json)

          echo ""
          echo "HTTP 状态码：$HTTP_CODE"

          echo ""
          echo "模型推理返回："
          cat /tmp/inference_run.json

          if [ "$HTTP_CODE" != "200" ] && \
             [ "$HTTP_CODE" != "201" ] && \
             [ "$HTTP_CODE" != "202" ]; then
            echo ""
            echo "❌ 推理接口调用失败"
            exit 1
          fi

          echo ""
          echo "✅ 推理请求成功"


      # =========================================================
      # 16. 获取 Run ID
      # =========================================================
      - name: 获取推理 Run ID
        run: |
          echo "========================================================="
          echo "获取推理 Run ID"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open("/tmp/inference_run.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          run_id = None

          if isinstance(data, dict):

              run_id = (
                  data.get("run_id")
                  or data.get("inference_run_id")
              )

              if not run_id and isinstance(data.get("data"), dict):
                  run_id = (
                      data["data"].get("run_id")
                      or data["data"].get("inference_run_id")
                  )

              if not run_id and isinstance(data.get("result"), dict):
                  run_id = (
                      data["result"].get("run_id")
                      or data["result"].get("inference_run_id")
                  )

          if run_id:
              print("RUN_ID =", run_id)

              with open("/tmp/quantmind_run_id.txt", "w", encoding="utf-8") as f:
                  f.write(str(run_id))

          else:
              print("⚠️ 没有找到 RUN_ID")
          PY


      # =========================================================
      # 17. 获取最终推理结果
      # =========================================================
      - name: 获取最终推理结果
        run: |
          echo "========================================================="
          echo "获取最终推理结果"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          if [ -f /tmp/quantmind_run_id.txt ]; then

            RUN_ID=$(cat /tmp/quantmind_run_id.txt)

            echo "RUN_ID：$RUN_ID"

            HTTP_CODE=$(curl -s \
              -o /tmp/inference_detail.json \
              -w "%{http_code}" \
              "$QUANTMIND_URL/api/v1/models/inference/runs/$RUN_ID" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

            echo "HTTP 状态码：$HTTP_CODE"

            echo ""
            echo "推理结果："
            cat /tmp/inference_detail.json

            if [ "$HTTP_CODE" != "200" ]; then
              exit 1
            fi

          else

            echo "没有 RUN_ID，查询最新结果。"

            HTTP_CODE=$(curl -s \
              -o /tmp/inference_latest.json \
              -w "%{http_code}" \
              "$QUANTMIND_URL/api/v1/models/inference/latest" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

            echo "HTTP 状态码：$HTTP_CODE"

            cat /tmp/inference_latest.json

            if [ "$HTTP_CODE" != "200" ]; then
              exit 1
            fi

          fi


      # =========================================================
      # 18. 分析结果
      # =========================================================
      - name: 分析 QuantMind 选股结果
        run: |
          echo "========================================================="
          echo "分析 QuantMind 选股结果"
          echo "========================================================="

          RESULT_FILE=""

          if [ -f /tmp/inference_detail.json ]; then
            RESULT_FILE="/tmp/inference_detail.json"
          elif [ -f /tmp/inference_latest.json ]; then
            RESULT_FILE="/tmp/inference_latest.json"
          fi

          if [ -z "$RESULT_FILE" ]; then
            echo "❌ 没有推理结果"
            exit 1
          fi

          python3 - "$RESULT_FILE" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("=========================================================")
          print("QuantMind 最终结果")
          print("=========================================================")

          print(json.dumps(data, ensure_ascii=False, indent=2))

          summary = {}

          if isinstance(data, dict):
              summary = data.get("summary", {})

              if not summary and isinstance(data.get("data"), dict):
                  summary = data["data"].get("summary", {})

          status = summary.get("status")

          if status is None and isinstance(data, dict):
              status = data.get("status")

          success = summary.get("success")

          if success is None and isinstance(data, dict):
              success = data.get("success")

          print("")
          print("最终 status =", status)
          print("最终 success =", success)

          if status in {"failed", "error"} or success is False:

              print("")
              print("❌ QuantMind 推理失败")

              print(
                  "失败阶段：",
                  summary.get("failure_stage")
              )

              print(
                  "错误原因：",
                  summary.get("error_message")
              )

              print(
                  "Fallback：",
                  summary.get("fallback_reason")
              )

              raise SystemExit(1)

          if status in {
              "completed",
              "success",
              "succeeded",
              "finished",
              "done"
          } or success is True:

              print("")
              print("✅ QuantMind 推理成功")

              print(
                  "信号数量：",
                  summary.get("signals_count")
              )

              print(
                  "股票数量：",
                  summary.get("symbols_count")
              )

              raise SystemExit(0)

          print("")
          print("⚠️ 返回结果状态无法识别")
          print("请查看上面的完整 JSON。")
          PY


      # =========================================================
      # 19. 最终 Docker 状态
      # =========================================================
      - name: 输出最终 Docker 状态
        if: always()
        run: |
          echo "========================================================="
          echo "最终 Docker 状态"
          echo "========================================================="

          docker ps -a


      # =========================================================
      # 20. 失败诊断
      # =========================================================
      - name: 失败诊断
        if: failure()
        run: |
          echo "========================================================="
          echo "QuantMind 失败诊断"
          echo "========================================================="

          echo ""
          echo "【QuantMind Mounts】"

          docker inspect quantmind \
            --format '{{range .Mounts}}{{println "TYPE=" .Type "SOURCE=" .Source "DEST=" .Destination "RW=" .RW}}{{end}}' \
            || true

          echo ""
          echo "【QuantMind /data】"

          docker exec quantmind sh -c '
            ls -lah /data 2>&1 || true
            echo ""
            ls -lah /data/quantdb 2>&1 || true
          ' || true

          echo ""
          echo "【QuantMind 最近日志】"

          docker logs --tail 300 quantmind || true

          echo ""
          echo "【Data Gateway 最近日志】"

          docker logs --tail 200 quantmind-data-gateway || true

          echo ""
          echo "【Precheck】"

          if [ -f /tmp/quantmind_precheck.json ]; then
            cat /tmp/quantmind_precheck.json
          fi

          echo ""
          echo "【Inference】"

          if [ -f /tmp/inference_run.json ]; then
            cat /tmp/inference_run.json
          fi

          if [ -f /tmp/inference_detail.json ]; then
            cat /tmp/inference_detail.json
          fi


      # =========================================================
      # 21. 清理
      # =========================================================
      - name: 清理临时文件
        if: always()
        run: |
          rm -f /tmp/login_payload.json
          rm -f /tmp/quantmind_token.txt
          rm -f /tmp/quantmind_login.json
          rm -f /tmp/quantmind_me.json
          rm -f /tmp/quantmind_models.json
          rm -f /tmp/quantmind_precheck.json
          rm -f /tmp/quantmind_model_id.txt
          rm -f /tmp/quantmind_inference_date.txt
          rm -f /tmp/quantmind_run_id.txt
          rm -f /tmp/inference_request.json
          rm -f /tmp/inference_run.json
          rm -f /tmp/inference_detail.json
          rm -f /tmp/inference_latest.json
          rm -f /tmp/quantmind_health.json
