name: QuantMind 部署测试

on:
  workflow_dispatch:

jobs:
  quantmind:
    runs-on: ubuntu-22.04

    timeout-minutes: 180

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: 1. Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. 系统环境检查
      # =========================================================
      - name: 2. 系统环境检查
        run: |
          echo "========================================================="
          echo "系统环境检查"
          echo "========================================================="

          echo
          echo "操作系统："
          uname -a

          echo
          echo "Docker："
          docker --version

          echo
          echo "Docker Compose："
          docker compose version

          echo
          echo "磁盘空间："
          df -h

          echo
          echo "内存："
          free -h

      # =========================================================
      # 3. 执行 QuantMind 官方完整部署
      # =========================================================
      - name: 3. 执行 QuantMind 官方完整部署
        run: |
          echo "========================================================="
          echo "开始执行 QuantMind 官方 full-deploy.sh"
          echo "========================================================="

          sudo bash deploy/full-deploy.sh

      # =========================================================
      # 4. 查看 Docker 服务状态
      # =========================================================
      - name: 4. 查看 Docker 服务状态
        run: |
          echo "========================================================="
          echo "QuantMind Docker 服务状态"
          echo "========================================================="

          cd /opt/quantmind

          docker compose ps

      # =========================================================
      # 5. 等待 QuantMind API 健康
      # =========================================================
      - name: 5. 等待 QuantMind API 健康
        run: |
          echo "========================================================="
          echo "等待 QuantMind API 启动"
          echo "========================================================="

          for i in {1..60}; do

            echo
            echo "第 $i 次检查..."

            if curl -s --fail \
              http://127.0.0.1:8000/health \
              > /tmp/quantmind_health.json
            then

              echo "QuantMind API 已正常启动"

              cat /tmp/quantmind_health.json

              exit 0
            fi

            sleep 5

          done

          echo "QuantMind API 启动失败"

          cd /opt/quantmind

          docker compose ps

          exit 1

      # =========================================================
      # 5.1 OpenAPI 检查
      # =========================================================
      - name: 5.1 OpenAPI 检查
        run: |
          echo "========================================================="
          echo "检查 QuantMind OpenAPI"
          echo "========================================================="

          curl -s --fail \
            http://127.0.0.1:8000/openapi.json \
            -o /tmp/openapi.json

          echo
          echo "OpenAPI 文件大小："
          wc -c /tmp/openapi.json

          echo
          echo "API 总数量："

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          print(len(paths))
          PY

      # =========================================================
      # 5.2 查找推理相关接口
      # =========================================================
      - name: 5.2 查找推理相关接口
        run: |
          echo "========================================================="
          echo "查找 QuantMind 推理相关 API"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          keywords = [
              "inference",
              "predict",
              "signal",
              "model",
              "stock-terminal"
          ]

          for path, methods in paths.items():

              path_lower = path.lower()

              if any(k in path_lower for k in keywords):

                  for method, info in methods.items():

                      if method.lower() in {
                          "get",
                          "post",
                          "put",
                          "patch"
                      }:

                          print(
                              f"{method.upper():6} "
                              f"{path} "
                              f"-> "
                              f"{info.get('summary', '')}"
                          )
          PY

      # =========================================================
      # 5.3 检查管理员推理前置接口
      # =========================================================
      - name: 5.3 检查管理员推理前置接口
        run: |
          echo "========================================================="
          echo "检查 QuantMind 管理员推理前置接口"
          echo "========================================================="

          curl -i \
            http://127.0.0.1:8000/api/v1/admin/models/precheck-inference \
            || true

      # =========================================================
      # 5.4 查看推理请求参数结构
      # =========================================================
      - name: 5.4 查看推理请求参数结构
        run: |
          echo "========================================================="
          echo "查看 InferenceRunRequest / BatchInferenceRequest"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          schemas = (
              data
              .get("components", {})
              .get("schemas", {})
          )

          for name in [
              "InferenceRunRequest",
              "BatchInferenceRequest"
          ]:

              print()
              print("=" * 60)
              print(name)
              print("=" * 60)

              schema = schemas.get(name)

              if schema:
                  print(
                      json.dumps(
                          schema,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
              else:
                  print("未找到该 Schema")
          PY

      # =========================================================
      # 5.5 查找可能的推理触发接口
      # =========================================================
      - name: 5.5 查找可能的推理触发接口
        run: |
          echo "========================================================="
          echo "查找可能的推理触发接口"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          keywords = [
              "inference",
              "predict",
              "signal",
              "training",
              "backfill"
          ]

          for path, methods in paths.items():

              path_lower = path.lower()

              if any(k in path_lower for k in keywords):

                  for method, info in methods.items():

                      if method.upper() in {
                          "POST",
                          "PUT",
                          "PATCH"
                      }:

                          print()
                          print(
                              f"{method.upper()} {path}"
                          )

                          print(
                              "Summary:",
                              info.get("summary", "")
                          )
          PY

      # =========================================================
      # 5.6 查询当前默认模型
      # =========================================================
      - name: 5.6 查询当前默认模型
        run: |
          echo "========================================================="
          echo "查询 QuantMind 当前默认模型"
          echo "========================================================="

          curl -i \
            http://127.0.0.1:8000/api/v1/models/default \
            || true

      # =========================================================
      # 5.6A 查找认证 / 登录接口
      # =========================================================
      - name: 5.6A 查找认证登录接口
        run: |
          echo "========================================================="
          echo "查找 QuantMind 认证 / 登录接口"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          for path in [
              "/api/v1/auth/login",
              "/api/v1/auth/logout",
              "/api/v1/auth/refresh",
              "/api/v1/users/me"
          ]:

              print()
              print("=" * 70)
              print(path)
              print("=" * 70)

              methods = paths.get(path)

              if not methods:
                  print("未找到")
                  continue

              for method, info in methods.items():

                  print(
                      method.upper(),
                      "->",
                      info.get("summary", "")
                  )

                  if info.get("description"):
                      print(
                          info.get("description")
                      )
          PY

      # =========================================================
      # 5.6B 查看登录请求 / Token 响应结构
      # =========================================================
      - name: 5.6B 查看登录请求 Token 响应结构
        run: |
          echo "========================================================="
          echo "查看 QuantMind 登录请求和 Token 响应结构"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          schemas = (
              data
              .get("components", {})
              .get("schemas", {})
          )

          for name in [
              "UserLogin",
              "TokenResponse",
              "RefreshTokenRequest"
          ]:

              print()
              print("=" * 70)
              print(name)
              print("=" * 70)

              schema = schemas.get(name)

              if schema:
                  print(
                      json.dumps(
                          schema,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
              else:
                  print("未找到该 Schema")

      # =========================================================
      # 5.6C 真实登录测试
      # =========================================================
      - name: 5.6C QuantMind 真实登录测试
        env:
          QUANTMIND_TENANT_ID: ${{ secrets.QUANTMIND_TENANT_ID }}
          QUANTMIND_USERNAME: ${{ secrets.QUANTMIND_USERNAME }}
          QUANTMIND_PASSWORD: ${{ secrets.QUANTMIND_PASSWORD }}
        run: |
          echo "========================================================="
          echo "QuantMind 真实登录测试"
          echo "========================================================="

          if [ -z "$QUANTMIND_TENANT_ID" ]; then
            echo "错误：没有设置 QUANTMIND_TENANT_ID"
            exit 1
          fi

          if [ -z "$QUANTMIND_USERNAME" ]; then
            echo "错误：没有设置 QUANTMIND_USERNAME"
            exit 1
          fi

          if [ -z "$QUANTMIND_PASSWORD" ]; then
            echo "错误：没有设置 QUANTMIND_PASSWORD"
            exit 1
          fi

          echo "租户 ID：已配置"
          echo "用户名：已配置"
          echo "密码：已配置"

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = "http://127.0.0.1:8000/api/v1/auth/login"

          payload = {
              "tenant_id": os.environ["QUANTMIND_TENANT_ID"],
              "username": os.environ["QUANTMIND_USERNAME"],
              "password": os.environ["QUANTMIND_PASSWORD"],
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  body = response.read().decode(
                      "utf-8"
                  )

                  print(
                      "HTTP 状态码:",
                      response.status
                  )

                  result = json.loads(body)

          except urllib.error.HTTPError as e:

              body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(
                  "HTTP 状态码:",
                  e.code
              )

              print(
                  "登录失败响应:"
              )

              print(body)

              raise SystemExit(1)

          except Exception as e:

              print(
                  "登录请求失败:",
                  repr(e)
              )

              raise SystemExit(1)

          access_token = result.get(
              "access_token"
          )

          refresh_token = result.get(
              "refresh_token"
          )

          expires_in = result.get(
              "expires_in"
          )

          token_type = result.get(
              "token_type",
              "bearer"
          )

          if not access_token:

              print(
                  "登录响应中没有 access_token"
              )

              print(
                  "返回字段:",
                  list(result.keys())
              )

              raise SystemExit(1)

          print("登录成功")
          print(
              "token_type:",
              token_type
          )
          print(
              "expires_in:",
              expires_in
          )
          print(
              "access_token: 已获取"
          )
          print(
              "refresh_token:",
              "已获取" if refresh_token else "未返回"
          )

          # 不把真实 Token 打到 GitHub 日志
          with open(
              "/tmp/quantmind_access_token",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(access_token)

          os.chmod(
              "/tmp/quantmind_access_token",
              0o600
          )

          # 通过 GitHub 环境文件传给后续步骤
          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as f:

              f.write(
                  "QUANTMIND_ACCESS_TOKEN="
                  + access_token
                  + "\n"
              )

          print()
          print(
              "Token 已保存到当前 Runner 环境"
          )
          PY

      # =========================================================
      # 5.6D 使用 Token 检查当前用户
      # =========================================================
      - name: 5.6D 检查当前登录用户
        env:
          QUANTMIND_ACCESS_TOKEN: ${{ env.QUANTMIND_ACCESS_TOKEN }}
        run: |
          echo "========================================================="
          echo "检查当前登录用户"
          echo "========================================================="

          if [ -z "$QUANTMIND_ACCESS_TOKEN" ]; then
            echo "没有取得 access_token"
            exit 1
          fi

          curl -i \
            -H "Authorization: Bearer ${QUANTMIND_ACCESS_TOKEN}" \
            http://127.0.0.1:8000/api/v1/users/me

      # =========================================================
      # 5.7 使用 Token 检查用户态推理
      # =========================================================
      - name: 5.7 使用 Token 检查用户态推理
        env:
          QUANTMIND_ACCESS_TOKEN: ${{ env.QUANTMIND_ACCESS_TOKEN }}
        run: |
          echo "========================================================="
          echo "使用 Token 检查用户态推理接口"
          echo "========================================================="

          curl -i \
            -H "Authorization: Bearer ${QUANTMIND_ACCESS_TOKEN}" \
            http://127.0.0.1:8000/api/v1/models/inference/precheck \
            || true

      # =========================================================
      # 5.8 使用 Token 检查股票终端
      # =========================================================
      - name: 5.8 使用 Token 检查股票终端
        env:
          QUANTMIND_ACCESS_TOKEN: ${{ env.QUANTMIND_ACCESS_TOKEN }}
        run: |
          echo "========================================================="
          echo "使用 Token 检查股票终端"
          echo "========================================================="

          curl -i \
            -H "Authorization: Bearer ${QUANTMIND_ACCESS_TOKEN}" \
            "http://127.0.0.1:8000/api/v1/stock-terminal/list?page=1&page_size=5" \
            || true

      # =========================================================
      # 5.9 使用 Token 检查市场日历
      # =========================================================
      - name: 5.9 使用 Token 检查市场日历
        env:
          QUANTMIND_ACCESS_TOKEN: ${{ env.QUANTMIND_ACCESS_TOKEN }}
        run: |
          echo "========================================================="
          echo "使用 Token 检查市场日历"
          echo "========================================================="

          curl -i \
            -H "Authorization: Bearer ${QUANTMIND_ACCESS_TOKEN}" \
            "http://127.0.0.1:8000/api/v1/stock-terminal/market-calendar?months=1" \
            || true

      # =========================================================
      # 6. 查看 Docker 最终状态
      # =========================================================
      - name: 6. 查看 Docker 最终状态
        if: always()
        run: |
          echo "========================================================="
          echo "QuantMind Docker 最终状态"
          echo "========================================================="

          cd /opt/quantmind

          docker compose ps

      # =========================================================
      # 7. 查看 QuantMind 日志
      # =========================================================
      - name: 7. 查看 QuantMind 日志
        if: always()
        run: |
          echo "========================================================="
          echo "QuantMind 日志"
          echo "========================================================="

          cd /opt/quantmind

          docker compose logs --tail=200 quantmind || true

      # =========================================================
      # 8. 查看 Celery 日志
      # =========================================================
      - name: 8. 查看 Celery 日志
        if: always()
        run: |
          echo "========================================================="
          echo "Celery 日志"
          echo "========================================================="

          cd /opt/quantmind

          docker compose logs --tail=100 quantmind-celery || true

      # =========================================================
      # 9. 查看 Celery Beat 日志
      # =========================================================
      - name: 9. 查看 Celery Beat 日志
        if: always()
        run: |
          echo "========================================================="
          echo "Celery Beat 日志"
          echo "========================================================="

          cd /opt/quantmind

          docker compose logs --tail=100 quantmind-celery-beat || true

      # =========================================================
      # 10. 关闭 QuantMind
      # =========================================================
      - name: 10. 关闭 QuantMind
        if: always()
        run: |
          echo "========================================================="
          echo "关闭 QuantMind Docker 服务"
          echo "========================================================="

          cd /opt/quantmind

          docker compose down

          echo
          echo "========================================================="
          echo "QuantMind 本次测试完成"
          echo "========================================================="
