name: QuantMind 部署与推理接口检查

on:
  workflow_dispatch:

jobs:
  quantmind:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: 1. Checkout QuantMind
        uses: actions/checkout@v4

      # =========================================================
      # 2. 系统环境检查
      # =========================================================
      - name: 2. 系统与 Docker 检查
        run: |
          echo "========================================================="
          echo "系统信息"
          echo "========================================================="

          uname -a

          echo
          echo "Linux 发行版"
          lsb_release -a || true

          echo
          echo "========================================================="
          echo "Docker"
          echo "========================================================="

          docker --version
          docker compose version

          echo
          echo "========================================================="
          echo "磁盘空间"
          echo "========================================================="

          df -h

          echo
          echo "========================================================="
          echo "内存"
          echo "========================================================="

          free -h

      # =========================================================
      # 3. 使用作者提供的完整部署脚本
      # =========================================================
      - name: 3. 执行 QuantMind 作者完整部署
        run: |
          echo "========================================================="
          echo "开始执行 deploy/full-deploy.sh"
          echo "========================================================="

          sudo bash deploy/full-deploy.sh

      # =========================================================
      # 4. 查看 Docker 服务状态
      # =========================================================
      - name: 4. 检查 QuantMind 容器
        run: |
          echo "========================================================="
          echo "QuantMind Docker Compose 状态"
          echo "========================================================="

          cd /opt/quantmind

          docker compose ps

      # =========================================================
      # 5. 等待 QuantMind API
      # =========================================================
      - name: 5. 等待 QuantMind API
        run: |
          echo "========================================================="
          echo "等待 QuantMind API 启动"
          echo "========================================================="

          for i in {1..60}; do

            echo "第 $i 次检查..."

            if curl -s --fail \
              http://127.0.0.1:8000/health \
              > /tmp/health.json
            then

              echo
              echo "========================================================="
              echo "QuantMind API 已正常启动"
              echo "========================================================="

              cat /tmp/health.json || true

              exit 0
            fi

            sleep 5

          done

          echo
          echo "========================================================="
          echo "QuantMind API 启动失败"
          echo "========================================================="

          cd /opt/quantmind

          docker compose ps

          echo
          echo "最近日志："

          docker compose logs --tail=200

          exit 1

      # =========================================================
      # 5.1 获取 OpenAPI
      # =========================================================
      - name: 5.1 获取 OpenAPI
        run: |
          echo "========================================================="
          echo "获取 QuantMind OpenAPI"
          echo "========================================================="

          curl -s --fail \
            http://127.0.0.1:8000/openapi.json \
            -o /tmp/openapi.json

          echo
          echo "OpenAPI 文件大小："

          wc -c /tmp/openapi.json

          echo
          echo "OpenAPI 获取成功"

      # =========================================================
      # 5.2 OpenAPI 基本信息
      # =========================================================
      - name: 5.2 OpenAPI 基本信息
        run: |
          echo "========================================================="
          echo "OpenAPI 基本信息"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open(
              "/tmp/openapi.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          info = data.get("info", {})

          print("标题：", info.get("title"))
          print("版本：", info.get("version"))

          paths = data.get("paths", {})

          print("API 路由总数：", len(paths))
          PY

      # =========================================================
      # 5.3 检查推理相关 Schema
      # =========================================================
      - name: 5.3 检查推理 Schema
        run: |
          echo "========================================================="
          echo "检查推理相关 Schema"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open(
              "/tmp/openapi.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          schemas = data.get(
              "components",
              {}
          ).get(
              "schemas",
              {}
          )

          keywords = [
              "Inference",
              "Predict",
              "Prediction",
              "Signal",
              "Backfill",
              "Model",
          ]

          found = []

          for name in schemas:

              if any(
                  k.lower() in name.lower()
                  for k in keywords
              ):
                  found.append(name)

          print()
          print(
              "找到相关 Schema：",
              len(found)
          )

          print()

          for name in sorted(found):
              print(name)

          print()
          print("Schema 检查完成")
          PY

      # =========================================================
      # 5.4 精确检查 InferenceRunRequest / BatchInferenceRequest
      # =========================================================
      - name: 5.4 精确检查推理请求参数
        run: |
          echo "========================================================="
          echo "检查 QuantMind 推理请求参数"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open(
              "/tmp/openapi.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          schemas = data.get(
              "components",
              {}
          ).get(
              "schemas",
              {}
          )

          for name in [
              "InferenceRunRequest",
              "BatchInferenceRequest",
          ]:

              print()
              print("=" * 70)
              print(f"SCHEMA: {name}")
              print("=" * 70)

              schema = schemas.get(name)

              if schema is None:

                  print("未找到")

                  continue

              print(
                  json.dumps(
                      schema,
                      ensure_ascii=False,
                      indent=2
                  )
              )

          print()
          print("=" * 70)
          print("推理请求参数检查完成")
          print("=" * 70)
          PY

      # =========================================================
      # 5.5 精确查找真正的推理触发接口
      # =========================================================
      - name: 5.5 精确查找推理触发接口
        run: |
          echo "========================================================="
          echo "查找真正的推理触发接口"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open(
              "/tmp/openapi.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          keywords = [
              "inference",
              "infer",
              "predict",
              "backfill",
              "signal",
              "execute",
              "trigger",
              "run",
          ]

          methods_wanted = {
              "post",
              "put",
              "patch",
          }

          found = []

          for path, methods in data.get(
              "paths",
              {}
          ).items():

              path_lower = path.lower()

              if not any(
                  k in path_lower
                  for k in keywords
              ):
                  continue

              for method, info in methods.items():

                  if method.lower() not in methods_wanted:
                      continue

                  found.append(
                      (
                          method.upper(),
                          path,
                          info
                      )
                  )

          print()
          print("=" * 80)
          print(
              f"找到 {len(found)} 个可能的推理触发接口"
          )
          print("=" * 80)

          for method, path, info in found:

              print()
              print("-" * 80)

              print(
                  f"{method} {path}"
              )

              print(
                  f"Summary: {info.get('summary', '')}"
              )

              print(
                  f"Description: {info.get('description', '')}"
              )

              params = info.get(
                  "parameters",
                  []
              )

              if params:

                  print("Parameters:")

                  for p in params:

                      schema = p.get(
                          "schema",
                          {}
                      )

                      print(
                          f"  {p.get('name')} "
                          f"in={p.get('in')} "
                          f"required={p.get('required', False)} "
                          f"schema={schema}"
                      )

              body = info.get(
                  "requestBody"
              )

              if body:

                  print("RequestBody:")

                  for content_type, content in body.get(
                      "content",
                      {}
                  ).items():

                      print(
                          f"  Content-Type: {content_type}"
                      )

                      schema = content.get(
                          "schema",
                          {}
                      )

                      print(
                          "  Schema:",
                          json.dumps(
                              schema,
                              ensure_ascii=False
                          )
                      )

          print()
          print("=" * 80)
          print("推理触发接口检查完成")
          print("=" * 80)
          PY

      # =========================================================
      # 5.6 查询当前默认模型
      # =========================================================
      - name: 5.6 查询当前默认模型
        run: |
          echo "========================================================="
          echo "查询 QuantMind 当前默认模型"
          echo "========================================================="

          echo
          echo "GET /api/v1/models/default"
          echo

          curl -s --fail \
            http://127.0.0.1:8000/api/v1/models/default \
            | python3 -m json.tool

          echo
          echo "========================================================="
          echo "默认模型查询完成"
          echo "========================================================="

      # =========================================================
      # 6. 保存 OpenAPI 检查结果
      # =========================================================
      - name: 6. 保存 OpenAPI 检查结果
        if: always()
        run: |
          echo "========================================================="
          echo "保存 OpenAPI 文件"
          echo "========================================================="

          mkdir -p artifacts

          if [ -f /tmp/openapi.json ]; then
            cp /tmp/openapi.json \
              artifacts/openapi.json
          fi

          echo "OpenAPI 文件已保存"

      # =========================================================
      # 7. 最终 Docker 状态
      # =========================================================
      - name: 7. 最终 Docker 状态与日志
        if: always()
        run: |
          echo "========================================================="
          echo "最终 Docker 状态"
          echo "========================================================="

          cd /opt/quantmind || exit 0

          docker compose ps

          echo
          echo "========================================================="
          echo "QuantMind 最近日志"
          echo "========================================================="

          docker compose logs --tail=100 || true

      # =========================================================
      # 8. 上传检查结果
      # =========================================================
      - name: 8. 上传检查结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantmind-openapi-check
          path: artifacts/
          if-no-files-found: warn

      # =========================================================
      # 9. 关闭 QuantMind
      # =========================================================
      - name: 9. 关闭 QuantMind
        if: always()
        run: |
          echo "========================================================="
          echo "关闭 QuantMind Docker 服务"
          echo "========================================================="

          cd /opt/quantmind || exit 0

          docker compose down

          echo
          echo "QuantMind 已关闭"
