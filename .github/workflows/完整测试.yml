name: QuantMind 每日自动选股

on:
  workflow_dispatch:

  schedule:
    # 北京时间周一至周五 15:30
    # GitHub Actions 使用 UTC
    # 北京时间 = UTC + 8
    - cron: "30 7 * * 1-5"

jobs:
  quantmind:
    runs-on: ubuntu-22.04

    env:
      QUANTMIND_TENANT_ID: ${{ secrets.QUANTMIND_TENANT_ID }}
      QUANTMIND_USERNAME: ${{ secrets.QUANTMIND_USERNAME }}
      QUANTMIND_PASSWORD: ${{ secrets.QUANTMIND_PASSWORD }}

      # QuantMind 在 GitHub Actions 当前 Runner 上的地址
      QUANTMIND_URL: http://127.0.0.1:8000

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: 1. Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. 系统环境
      # =========================================================
      - name: 2. 检查系统环境
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "系统环境"
          echo "========================================================="

          echo "操作系统："
          uname -a

          echo
          echo "Python："
          python3 --version || true

          echo
          echo "Docker："
          docker --version || true

          echo
          echo "Docker Compose："
          docker compose version || true

      # =========================================================
      # 3. 检查 GitHub Secrets
      # =========================================================
      - name: 3. 检查 QuantMind Secrets
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "检查 QuantMind 登录配置"
          echo "========================================================="

          if [ -z "$QUANTMIND_TENANT_ID" ]; then
            echo "❌ QUANTMIND_TENANT_ID 未配置"
            exit 1
          fi

          if [ -z "$QUANTMIND_USERNAME" ]; then
            echo "❌ QUANTMIND_USERNAME 未配置"
            exit 1
          fi

          if [ -z "$QUANTMIND_PASSWORD" ]; then
            echo "❌ QUANTMIND_PASSWORD 未配置"
            exit 1
          fi

          echo "Tenant ID：已配置"
          echo "Username：已配置"
          echo "Password：已配置"

      # =========================================================
      # 4. 官方部署
      # =========================================================
      - name: 4. 部署 QuantMind
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "开始部署 QuantMind"
          echo "========================================================="

          if [ ! -f "deploy/full-deploy.sh" ]; then
            echo "❌ 没有找到 deploy/full-deploy.sh"
            echo
            echo "当前目录："
            pwd
            echo
            echo "目录内容："
            ls -la
            exit 1
          fi

          echo "找到官方部署脚本：deploy/full-deploy.sh"

          sudo bash deploy/full-deploy.sh

      # =========================================================
      # 5. Docker 服务状态
      # =========================================================
      - name: 5. 检查 Docker 服务
        shell: bash
        run: |
          set +e

          echo "========================================================="
          echo "Docker 服务状态"
          echo "========================================================="

          docker ps -a

          echo
          docker compose ps 2>/dev/null || true

      # =========================================================
      # 6. 等待 QuantMind 启动
      # =========================================================
      - name: 6. 等待 QuantMind
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "等待 QuantMind API 启动"
          echo "========================================================="

          for i in $(seq 1 60); do

            echo "第 ${i}/60 次检查..."

            HTTP_CODE=$(curl \
              -s \
              -o /tmp/quantmind_health.txt \
              -w "%{http_code}" \
              "$QUANTMIND_URL/health" \
              || true)

            echo "HTTP 状态码：$HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo
              echo "✅ QuantMind 已启动"

              cat /tmp/quantmind_health.txt || true

              exit 0
            fi

            sleep 5
          done

          echo
          echo "❌ QuantMind 启动超时"

          echo
          echo "Docker 状态："
          docker ps -a

          echo
          echo "Docker Compose 状态："
          docker compose ps 2>/dev/null || true

          exit 1

      # =========================================================
      # 7. 下载 OpenAPI
      # =========================================================
      - name: 7. 获取 QuantMind OpenAPI
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "获取 QuantMind OpenAPI"
          echo "========================================================="

          curl \
            -fsS \
            "$QUANTMIND_URL/openapi.json" \
            -o /tmp/quantmind_openapi.json

          if [ ! -s /tmp/quantmind_openapi.json ]; then
            echo "❌ OpenAPI 文件为空"
            exit 1
          fi

          echo "✅ OpenAPI 获取成功"

          echo
          echo "OpenAPI 文件大小："
          wc -c /tmp/quantmind_openapi.json

      # =========================================================
      # 8. 检查关键 API
      # =========================================================
      - name: 8. 检查 QuantMind 关键 API
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 关键 API"
          echo "========================================================="

          python3 - <<'PY'
          import json

          path = "/tmp/quantmind_openapi.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          targets = [
              "/api/v1/auth/login",
              "/api/v1/users/me",
              "/api/v1/models",
              "/api/v1/models/inference/precheck",
              "/api/v1/models/inference/run",
              "/api/v1/models/inference/latest",
              "/api/v1/models/inference/runs",
          ]

          for target in targets:
              if target in paths:
                  print(f"✅ {target}")
              else:
                  print(f"⚠️ 未找到 {target}")

          print()
          print("实际推理接口：")

          path = "/api/v1/models/inference/run"

          if path in paths:
              operation = paths[path].get("post", {})

              print("POST", path)
              print("summary:", operation.get("summary"))

              request_body = operation.get("requestBody")

              if request_body:
                  print("requestBody:")
                  print(
                      json.dumps(
                          request_body,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
          PY

      # =========================================================
      # 9. 登录 QuantMind
      # =========================================================
      - name: 9. QuantMind 登录
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 登录认证"
          echo "========================================================="

          LOGIN_URL="$QUANTMIND_URL/api/v1/auth/login"

          echo "登录地址：$LOGIN_URL"
          echo "Tenant ID：已隐藏"
          echo "Username：已隐藏"
          echo "Password：已隐藏"

          cat > /tmp/login.json <<EOF
          {
            "tenant_id": "$QUANTMIND_TENANT_ID",
            "username": "$QUANTMIND_USERNAME",
            "password": "$QUANTMIND_PASSWORD"
          }
          EOF

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/login_response.json \
            -w "%{http_code}" \
            -X POST \
            "$LOGIN_URL" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            --data @/tmp/login.json)

          echo "登录 HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo
            echo "❌ QuantMind 登录失败"
            echo
            echo "服务器返回："
            cat /tmp/login_response.json
            exit 1
          fi

          python3 - <<'PY'
          import json

          path = "/tmp/login_response.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          token = data.get("access_token")

          if not token:
              print("❌ 登录成功，但没有找到 access_token")
              print(json.dumps(data, ensure_ascii=False, indent=2))
              raise SystemExit(1)

          with open("/tmp/quantmind_token.txt", "w") as f:
              f.write(token)

          print("✅ QuantMind 登录成功")
          print("Access Token：已获取")
          PY

          rm -f /tmp/login.json

      # =========================================================
      # 10. 验证当前用户
      # =========================================================
      - name: 10. 验证登录状态
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "验证 QuantMind 当前用户"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/current_user.json \
            -w "%{http_code}" \
            "$QUANTMIND_URL/api/v1/users/me" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

          echo "HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 用户验证失败"
            cat /tmp/current_user.json
            exit 1
          fi

          echo "✅ 当前用户验证成功"

          python3 - <<'PY'
          import json

          with open("/tmp/current_user.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print()

          if isinstance(data, dict):
              for key in ["id", "username", "email", "tenant_id", "role"]:
                  if key in data:
                      print(f"{key}: {data[key]}")
          PY

      # =========================================================
      # 11. 获取模型列表
      # =========================================================
      - name: 11. 获取 QuantMind 模型
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 模型列表"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/models.json \
            -w "%{http_code}" \
            "$QUANTMIND_URL/api/v1/models" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

          echo "HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 获取模型失败"
            cat /tmp/models.json
            exit 1
          fi

          echo "✅ 模型列表获取成功"

          python3 - <<'PY'
          import json

          with open("/tmp/models.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print()
          print("模型数据：")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      # =========================================================
      # 12. 推理前置检查
      # =========================================================
      - name: 12. 推理前置检查
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 推理前置检查"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/precheck.json \
            -w "%{http_code}" \
            "$QUANTMIND_URL/api/v1/models/inference/precheck" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

          echo "HTTP 状态码：$HTTP_CODE"

          echo
          echo "Precheck 返回："

          cat /tmp/precheck.json

          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 推理前置检查失败"
            exit 1
          fi

          echo "✅ 推理前置检查通过"

      # =========================================================
      # 13. 获取 InferenceRunRequest 参数
      # =========================================================
      - name: 13. 获取 InferenceRunRequest 参数
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "InferenceRunRequest 参数"
          echo "========================================================="

          python3 - <<'PY'
          import json

          path = "/tmp/quantmind_openapi.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          schemas = data.get("components", {}).get("schemas", {})

          schema = schemas.get("InferenceRunRequest")

          if not schema:
              print("❌ 没有找到 InferenceRunRequest")
              raise SystemExit(1)

          print(
              json.dumps(
                  schema,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      # =========================================================
      # 14. 显示实际推理接口
      # =========================================================
      - name: 14. 显示推理接口详细定义
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 模型推理接口"
          echo "========================================================="

          python3 - <<'PY'
          import json

          path = "/tmp/quantmind_openapi.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          endpoint = "/api/v1/models/inference/run"

          operation = (
              data
              .get("paths", {})
              .get(endpoint, {})
              .get("post", {})
          )

          print("METHOD: POST")
          print("PATH:", endpoint)
          print()
          print("SUMMARY:")
          print(operation.get("summary"))
          print()
          print("REQUEST BODY:")
          print(
              json.dumps(
                  operation.get("requestBody"),
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      # =========================================================
      # 15. 暂停在真实推理参数确认点
      #
      # 目前故意不执行 POST /models/inference/run
      # 因为 InferenceRunRequest 的字段还没有确认。
      #
      # 防止错误参数真正触发模型任务。
      # =========================================================
      - name: 15. 当前阶段完成
        shell: bash
        run: |
          set -e

          echo
          echo "========================================================="
          echo "QuantMind 自动选股准备完成"
          echo "========================================================="

          echo
          echo "目前已经确认："
          echo "✅ QuantMind 已部署"
          echo "✅ QuantMind API 已启动"
          echo "✅ OpenAPI 获取成功"
          echo "✅ 登录成功"
          echo "✅ Access Token 获取成功"
          echo "✅ 当前用户验证成功"
          echo "✅ 模型接口正常"
          echo "✅ 推理前置检查已执行"
          echo "✅ POST /api/v1/models/inference/run 已确认"
          echo
          echo "⚠️ 暂时没有真正执行模型推理。"
          echo
          echo "原因："
          echo "还需要确认 InferenceRunRequest 的具体字段。"
          echo
          echo "下一步只需要把本次运行日志中的："
          echo
          echo "InferenceRunRequest 参数"
          echo
          echo "这一部分发给我。"
          echo
          echo "========================================================="

      # =========================================================
      # 16. 最终 Docker 状态
      # =========================================================
      - name: 16. 最终 Docker 状态
        if: always()
        shell: bash
        run: |
          echo "========================================================="
          echo "最终 Docker 状态"
          echo "========================================================="

          docker ps -a || true

          echo
          echo "Docker Compose："

          docker compose ps 2>/dev/null || true

      # =========================================================
      # 17. 失败时输出日志
      # =========================================================
      - name: 17. 失败日志
        if: failure()
        shell: bash
        run: |
          echo "========================================================="
          echo "QuantMind 失败诊断"
          echo "========================================================="

          echo
          echo "Docker 容器："
          docker ps -a || true

          echo
          echo "Docker Compose："
          docker compose ps 2>/dev/null || true

          echo
          echo "最近容器日志："

          for container in $(docker ps -aq); do
            echo
            echo "---------------------------------------------------------"
            echo "CONTAINER: $container"
            echo "---------------------------------------------------------"

            docker logs --tail 100 "$container" 2>&1 || true
          done

      # =========================================================
      # 18. 清理 Token
      # =========================================================
      - name: 18. 清理临时认证文件
        if: always()
        shell: bash
        run: |
          rm -f /tmp/quantmind_token.txt
          rm -f /tmp/login.json
          rm -f /tmp/login_response.json
          rm -f /tmp/current_user.json
