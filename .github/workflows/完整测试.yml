name: QuantMind 每日自动运行

on:
  workflow_dispatch:

  schedule:
    # 北京时间周一至周五 15:30
    # GitHub Actions 使用 UTC
    # 北京时间 = UTC + 8
    - cron: "30 7 * * 1-5"

jobs:

  quantmind:

    runs-on: ubuntu-22.04

    timeout-minutes: 180

    env:
      # =========================================================
      # QuantMind 配置
      # =========================================================
      QUANTMIND_TENANT_ID: ${{ secrets.QUANTMIND_TENANT_ID }}
      QUANTMIND_USERNAME: ${{ secrets.QUANTMIND_USERNAME }}
      QUANTMIND_PASSWORD: ${{ secrets.QUANTMIND_PASSWORD }}

      # QuantMind 部署在 GitHub Runner 本机
      QUANTMIND_URL: http://127.0.0.1:8000

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: 1. Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. 系统与 Docker 检查
      # =========================================================
      - name: 2. 系统与 Docker 检查
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "系统与 Docker 检查"
          echo "========================================================="

          echo
          echo "系统版本："
          lsb_release -a || true

          echo
          echo "Docker："
          docker --version

          echo
          echo "Docker Compose："
          docker compose version

          echo
          echo "磁盘："
          df -h

          echo
          echo "内存："
          free -h


      # =========================================================
      # 3. 检查 QuantMind Secrets
      # =========================================================
      - name: 3. 检查 QuantMind Secrets
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "检查 QuantMind Secrets"
          echo "========================================================="

          if [ -z "$QUANTMIND_TENANT_ID" ]; then
            echo "错误：QUANTMIND_TENANT_ID 没有设置"
            exit 1
          fi

          if [ -z "$QUANTMIND_USERNAME" ]; then
            echo "错误：QUANTMIND_USERNAME 没有设置"
            exit 1
          fi

          if [ -z "$QUANTMIND_PASSWORD" ]; then
            echo "错误：QUANTMIND_PASSWORD 没有设置"
            exit 1
          fi

          echo "QUANTMIND_TENANT_ID：已设置"
          echo "QUANTMIND_USERNAME：已设置"
          echo "QUANTMIND_PASSWORD：已设置"


      # =========================================================
      # 4. 官方完整部署
      # =========================================================
      - name: 4. 官方完整部署 QuantMind
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "开始部署 QuantMind"
          echo "========================================================="

          sudo bash deploy/full-deploy.sh


      # =========================================================
      # 5. Docker 服务状态
      # =========================================================
      - name: 5. Docker 服务状态
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind Docker 服务状态"
          echo "========================================================="

          cd /opt/quantmind

          docker compose ps


      # =========================================================
      # 6. QuantMind Health Check
      # =========================================================
      - name: 6. QuantMind Health Check
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "等待 QuantMind 启动"
          echo "========================================================="

          HEALTH_URL="$QUANTMIND_URL/health"

          for i in $(seq 1 60); do

            echo "健康检查第 $i/60 次..."

            if curl \
              -fsS \
              --max-time 10 \
              "$HEALTH_URL" \
              > /tmp/quantmind_health.json
            then

              echo
              echo "========================================================="
              echo "QuantMind Health Check 成功"
              echo "========================================================="

              cat /tmp/quantmind_health.json

              exit 0
            fi

            sleep 5

          done

          echo
          echo "========================================================="
          echo "QuantMind Health Check 失败"
          echo "========================================================="

          cd /opt/quantmind

          docker compose ps

          exit 1


      # =========================================================
      # 7. OpenAPI 检查
      # =========================================================
      - name: 7. QuantMind OpenAPI 检查
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind OpenAPI 检查"
          echo "========================================================="

          OPENAPI_URL="$QUANTMIND_URL/openapi.json"

          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/quantmind_openapi.json \
            -w "%{http_code}" \
            --max-time 60 \
            "$OPENAPI_URL")

          echo "OpenAPI HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "OpenAPI 获取失败"
            cat /tmp/quantmind_openapi.json || true
            exit 1
          fi

          python3 - <<'PY'
          import json

          path = "/tmp/quantmind_openapi.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          print()
          print("=========================================================")
          print("QuantMind 相关 API 路由")
          print("=========================================================")

          keywords = [
              "auth",
              "login",
              "inference",
              "predict",
              "signal",
              "stock",
              "model",
              "terminal",
              "calendar",
              "strategy"
          ]

          found = []

          for path, methods in paths.items():

              lower_path = path.lower()

              if any(k in lower_path for k in keywords):

                  for method in methods.keys():

                      if method.lower() in [
                          "get",
                          "post",
                          "put",
                          "patch",
                          "delete"
                      ]:

                          found.append(
                              f"{method.upper():6} {path}"
                          )

          for item in sorted(found):
              print(item)

          print()
          print(f"发现相关 API：{len(found)}")

          with open(
              "/tmp/quantmind_api_routes.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for item in sorted(found):
                  f.write(item + "\n")
          PY


      # =========================================================
      # 8. 检查认证 API
      # =========================================================
      - name: 8. 检查认证 API
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 认证 API"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open(
              "/tmp/quantmind_openapi.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          paths = data.get("paths", {})

          for path, methods in paths.items():

              if "auth" not in path.lower():
                  continue

              print()
              print("---------------------------------------------------------")
              print(path)
              print("---------------------------------------------------------")

              for method, info in methods.items():

                  if method.lower() not in [
                      "get",
                      "post",
                      "put",
                      "patch",
                      "delete"
                  ]:
                      continue

                  print()
                  print(method.upper())

                  if info.get("summary"):
                      print(
                          "summary:",
                          info["summary"]
                      )

                  if info.get("operationId"):
                      print(
                          "operationId:",
                          info["operationId"]
                      )

                  if info.get("requestBody"):
                      print("requestBody:")
                      print(
                          json.dumps(
                              info["requestBody"],
                              ensure_ascii=False,
                              indent=2
                          )
                      )
          PY


      # =========================================================
      # 9. QuantMind 登录认证
      #
      # 注意：
      # tenant_id 必须同时放在请求体中
      # X-Tenant-Id 请求头也保留
      # =========================================================
      - name: 9. QuantMind 登录认证
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 登录认证"
          echo "========================================================="

          LOGIN_URL="$QUANTMIND_URL/api/v1/auth/login"

          echo "登录地址：$LOGIN_URL"
          echo "Tenant ID：$QUANTMIND_TENANT_ID"
          echo "Username：$QUANTMIND_USERNAME"
          echo "Password：已隐藏"

          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/quantmind_login.json \
            -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            "$LOGIN_URL" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            -d "{
              \"tenant_id\": \"$QUANTMIND_TENANT_ID\",
              \"username\": \"$QUANTMIND_USERNAME\",
              \"password\": \"$QUANTMIND_PASSWORD\"
            }")

          echo
          echo "登录 HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then

            echo
            echo "========================================================="
            echo "QuantMind 登录失败"
            echo "========================================================="

            cat /tmp/quantmind_login.json || true

            exit 1
          fi

          python3 - <<'PY'
          import json
          import sys

          path = "/tmp/quantmind_login.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          token = data.get("access_token")

          if not token:

              print(
                  "错误：登录返回中没有 access_token"
              )

              print(
                  "返回字段：",
                  list(data.keys())
              )

              print(
                  "完整返回：",
                  data
              )

              sys.exit(1)

          print()
          print("=========================================================")
          print("QuantMind 登录成功")
          print("=========================================================")
          print("Access Token：已获取")
          print("=========================================================")

          with open(
              "/tmp/quantmind_token.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(token)
          PY


      # =========================================================
      # 10. 验证当前用户
      # =========================================================
      - name: 10. 验证当前用户
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "验证 QuantMind 当前用户"
          echo "========================================================="

          if [ ! -f /tmp/quantmind_token.txt ]; then
            echo "错误：Token 文件不存在"
            exit 1
          fi

          TOKEN=$(cat /tmp/quantmind_token.txt)

          USER_URL="$QUANTMIND_URL/api/v1/users/me"

          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/quantmind_user.json \
            -w "%{http_code}" \
            --max-time 60 \
            "$USER_URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

          echo "当前用户 API HTTP 状态码：$HTTP_CODE"

          cat /tmp/quantmind_user.json || true

          if [ "$HTTP_CODE" != "200" ]; then
            echo
            echo "当前用户认证验证失败"
            exit 1
          fi

          echo
          echo "========================================================="
          echo "当前用户验证成功"
          echo "========================================================="


      # =========================================================
      # 11. 模型 API 检查
      # =========================================================
      - name: 11. QuantMind 模型 API 检查
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 模型 API"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          echo
          echo "检查：/api/v1/models"

          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/quantmind_models.json \
            -w "%{http_code}" \
            --max-time 60 \
            "$QUANTMIND_URL/api/v1/models" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            || true)

          echo "HTTP 状态码：$HTTP_CODE"

          cat /tmp/quantmind_models.json || true

          echo

          echo "检查：/api/v1/models/inference/precheck"

          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/quantmind_model_precheck.json \
            -w "%{http_code}" \
            --max-time 60 \
            "$QUANTMIND_URL/api/v1/models/inference/precheck" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            || true)

          echo "HTTP 状态码：$HTTP_CODE"

          cat /tmp/quantmind_model_precheck.json || true


      # =========================================================
      # 12. 查找推理 / 选股接口
      # =========================================================
      - name: 12. 查找 QuantMind 推理与选股接口
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "查找 QuantMind 推理 / 选股接口"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open(
              "/tmp/quantmind_openapi.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          paths = data.get("paths", {})

          keywords = [
              "inference",
              "predict",
              "prediction",
              "signal",
              "stock",
              "strategy",
              "screen",
              "selection",
              "model"
          ]

          for path, methods in sorted(paths.items()):

              if not any(
                  keyword in path.lower()
                  for keyword in keywords
              ):
                  continue

              print()
              print("=========================================================")
              print(path)
              print("=========================================================")

              for method, info in methods.items():

                  if method.lower() not in [
                      "get",
                      "post",
                      "put",
                      "patch"
                  ]:
                      continue

                  print(
                      f"METHOD: {method.upper()}"
                  )

                  if info.get("summary"):
                      print(
                          "SUMMARY:",
                          info["summary"]
                      )

                  if info.get("operationId"):
                      print(
                          "OPERATION:",
                          info["operationId"]
                      )

                  if info.get("requestBody"):

                      print("REQUEST BODY:")

                      print(
                          json.dumps(
                              info["requestBody"],
                              ensure_ascii=False,
                              indent=2
                          )
                      )
          PY


      # =========================================================
      # 13. Stock Terminal API
      # =========================================================
      - name: 13. Stock Terminal API 检查
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "Stock Terminal API"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          URL="$QUANTMIND_URL/api/v1/stock-terminal/list"

          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/quantmind_stock_terminal.json \
            -w "%{http_code}" \
            --max-time 60 \
            "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            || true)

          echo "HTTP 状态码：$HTTP_CODE"

          cat /tmp/quantmind_stock_terminal.json || true


      # =========================================================
      # 14. Market Calendar API
      # =========================================================
      - name: 14. Market Calendar API 检查
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "Market Calendar API"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          URL="$QUANTMIND_URL/api/v1/stock-terminal/market-calendar"

          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/quantmind_market_calendar.json \
            -w "%{http_code}" \
            --max-time 60 \
            "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            || true)

          echo "HTTP 状态码：$HTTP_CODE"

          cat /tmp/quantmind_market_calendar.json || true


      # =========================================================
      # 15. 输出所有可能的选股 / 推理 POST API
      # =========================================================
      - name: 15. 输出选股 POST API
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 可能的选股 / 推理 POST API"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open(
              "/tmp/quantmind_openapi.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          paths = data.get("paths", {})

          keywords = [
              "inference",
              "predict",
              "prediction",
              "signal",
              "stock",
              "strategy",
              "screen",
              "selection"
          ]

          found = False

          for path, methods in sorted(paths.items()):

              if not any(
                  k in path.lower()
                  for k in keywords
              ):
                  continue

              if "post" not in methods:
                  continue

              found = True

              info = methods["post"]

              print()
              print("---------------------------------------------------------")
              print("POST", path)
              print("---------------------------------------------------------")

              if info.get("summary"):
                  print(
                      "summary:",
                      info["summary"]
                  )

              if info.get("operationId"):
                  print(
                      "operationId:",
                      info["operationId"]
                  )

              request_body = info.get("requestBody")

              if request_body:

                  print("requestBody:")

                  print(
                      json.dumps(
                          request_body,
                          ensure_ascii=False,
                          indent=2
                      )
                  )

          if not found:

              print(
                  "没有找到明显的选股 / 推理 POST API"
              )
          PY


      # =========================================================
      # 16. 最终 Docker 状态
      # =========================================================
      - name: 16. QuantMind 最终 Docker 状态
        if: always()
        shell: bash
        run: |
          echo "========================================================="
          echo "QuantMind 最终 Docker 状态"
          echo "========================================================="

          if [ -d "/opt/quantmind" ]; then

            cd /opt/quantmind

            docker compose ps || true

          else

            echo "/opt/quantmind 不存在"

          fi


      # =========================================================
      # 17. QuantMind 日志
      # =========================================================
      - name: 17. QuantMind 日志
        if: failure()
        shell: bash
        run: |
          echo "========================================================="
          echo "QuantMind 日志"
          echo "========================================================="

          if [ -d "/opt/quantmind" ]; then

            cd /opt/quantmind

            docker compose logs \
              --tail=300 \
              quantmind || true

          fi


      # =========================================================
      # 18. Celery 日志
      # =========================================================
      - name: 18. Celery 日志
        if: failure()
        shell: bash
        run: |
          echo "========================================================="
          echo "Celery 日志"
          echo "========================================================="

          if [ -d "/opt/quantmind" ]; then

            cd /opt/quantmind

            docker compose logs \
              --tail=300 \
              quantmind-celery || true

          fi


      # =========================================================
      # 19. Celery Beat 日志
      # =========================================================
      - name: 19. Celery Beat 日志
        if: failure()
        shell: bash
        run: |
          echo "========================================================="
          echo "Celery Beat 日志"
          echo "========================================================="

          if [ -d "/opt/quantmind" ]; then

            cd /opt/quantmind

            docker compose logs \
              --tail=300 \
              quantmind-celery-beat || true

          fi


      # =========================================================
      # 20. 清理临时认证文件
      # =========================================================
      - name: 20. 清理临时认证文件
        if: always()
        shell: bash
        run: |
          rm -f /tmp/quantmind_token.txt
          rm -f /tmp/quantmind_login.json
          rm -f /tmp/quantmind_user.json
          rm -f /tmp/quantmind_health.json
          rm -f /tmp/quantmind_openapi.json
          rm -f /tmp/quantmind_api_routes.txt
          rm -f /tmp/quantmind_models.json
          rm -f /tmp/quantmind_model_precheck.json
          rm -f /tmp/quantmind_stock_terminal.json
          rm -f /tmp/quantmind_market_calendar.json
