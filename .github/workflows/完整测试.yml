name: QuantMind 每日自动运行

on:
  workflow_dispatch:

  schedule:
    # =========================================================
    # 北京时间周一至周五 15:30
    # GitHub Actions 使用 UTC
    # 北京时间 = UTC + 8
    # =========================================================
    - cron: "30 7 * * 1-5"


jobs:

  quantmind:

    runs-on: ubuntu-22.04

    timeout-minutes: 180

    env:

      # =======================================================
      # QuantMind 租户
      # GitHub:
      # Settings
      # → Secrets and variables
      # → Actions
      # =======================================================
      QUANTMIND_TENANT_ID: ${{ secrets.QUANTMIND_TENANT_ID }}

      # =======================================================
      # QuantMind 用户名
      # =======================================================
      QUANTMIND_USERNAME: ${{ secrets.QUANTMIND_USERNAME }}

      # =======================================================
      # QuantMind 密码
      # =======================================================
      QUANTMIND_PASSWORD: ${{ secrets.QUANTMIND_PASSWORD }}

      # =======================================================
      # QuantMind API 地址
      # =======================================================
      QUANTMIND_URL: http://127.0.0.1:8000


    steps:


      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: 1. Checkout

        uses: actions/checkout@v4


      # =========================================================
      # 2. 系统环境检查
      # =========================================================

      - name: 2. 系统环境检查

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "QuantMind 每日自动运行"
          echo "========================================================="

          echo
          echo "当前 UTC 时间："
          date -u

          echo
          echo "当前北京时间："
          TZ=Asia/Shanghai date

          echo
          echo "========================================================="
          echo "系统信息"
          echo "========================================================="

          lsb_release -a || true

          echo
          echo "Docker："

          docker --version

          echo
          echo "Docker Compose："

          docker compose version

          echo
          echo "磁盘："

          df -h

          echo
          echo "内存："

          free -h


      # =========================================================
      # 3. 检查 QuantMind Secrets
      # =========================================================

      - name: 3. 检查 QuantMind 配置

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "QuantMind 配置检查"
          echo "========================================================="

          if [ -z "$QUANTMIND_TENANT_ID" ]; then

            echo "错误："
            echo "QUANTMIND_TENANT_ID 没有配置"

            exit 1

          fi


          if [ -z "$QUANTMIND_USERNAME" ]; then

            echo "错误："
            echo "QUANTMIND_USERNAME 没有配置"

            exit 1

          fi


          if [ -z "$QUANTMIND_PASSWORD" ]; then

            echo "错误："
            echo "QUANTMIND_PASSWORD 没有配置"

            exit 1

          fi


          echo
          echo "Tenant ID：$QUANTMIND_TENANT_ID"

          echo "Username：$QUANTMIND_USERNAME"

          echo "Password：已配置"

          echo

          echo "QuantMind 认证变量检查通过"


      # =========================================================
      # 4. 官方完整部署
      # =========================================================

      - name: 4. QuantMind 官方完整部署

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "QuantMind 官方 full-deploy.sh"
          echo "========================================================="

          if [ ! -f "deploy/full-deploy.sh" ]; then

            echo "错误："

            echo "没有找到：deploy/full-deploy.sh"

            echo
            echo "当前目录："

            pwd

            echo
            echo "文件："

            ls -la

            exit 1

          fi


          sudo bash deploy/full-deploy.sh


      # =========================================================
      # 5. Docker 服务状态
      # =========================================================

      - name: 5. Docker 服务状态

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "QuantMind Docker 服务状态"
          echo "========================================================="

          cd /opt/quantmind

          docker compose ps


      # =========================================================
      # 6. 等待 QuantMind 启动
      # =========================================================

      - name: 6. QuantMind Health Check

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "QuantMind Health Check"
          echo "========================================================="

          for i in $(seq 1 60); do

            echo "第 ${i}/60 次检查..."

            if curl -fsS \
              --max-time 10 \
              "$QUANTMIND_URL/health" \
              -o /tmp/quantmind_health.json
            then

              echo
              echo "QuantMind Health Check 成功"

              cat /tmp/quantmind_health.json

              exit 0

            fi

            sleep 5

          done


          echo
          echo "========================================================="
          echo "QuantMind Health Check 失败"
          echo "========================================================="

          cd /opt/quantmind

          docker compose ps

          echo
          echo "QuantMind 日志："

          docker compose logs \
            --tail=300 \
            quantmind || true

          exit 1


      # =========================================================
      # 7. OpenAPI 检查
      # =========================================================

      - name: 7. OpenAPI 检查

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "QuantMind OpenAPI"
          echo "========================================================="

          curl -fsS \
            --max-time 60 \
            "$QUANTMIND_URL/openapi.json" \
            -o /tmp/quantmind_openapi.json


          python3 - <<'PY'

          import json


          path = "/tmp/quantmind_openapi.json"


          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          paths = data.get(
              "paths",
              {}
          )


          print(
              "OpenAPI 路由数量:",
              len(paths)
          )


          print()
          print(
              "=============================="
          )
          print(
              "认证相关 API"
          )
          print(
              "=============================="
          )


          for route in sorted(paths):

              if "auth" not in route.lower():

                  continue


              for method in paths[route]:

                  if method.startswith("x-"):

                      continue


                  print(
                      method.upper(),
                      route
                  )


          print()
          print(
              "=============================="
          )
          print(
              "模型 / 推理相关 API"
          )
          print(
              "=============================="
          )


          for route in sorted(paths):

              if not any(
                  key in route.lower()
                  for key in [
                      "model",
                      "inference",
                      "predict",
                      "signal",
                      "stock"
                  ]
              ):

                  continue


              for method in paths[route]:

                  if method.startswith("x-"):

                      continue


                  print(
                      method.upper(),
                      route
                  )

          PY


      # =========================================================
      # 8. 检查登录接口
      # =========================================================

      - name: 8. 检查认证 API

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "QuantMind 认证 API"
          echo "========================================================="


          python3 - <<'PY'

          import json


          with open(
              "/tmp/quantmind_openapi.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          paths = data.get(
              "paths",
              {}
          )


          found = False


          for route in sorted(paths):

              if "/auth/" not in route.lower():

                  continue


              found = True


              for method, spec in paths[route].items():

                  if method.startswith("x-"):

                      continue


                  print()
                  print(
                      method.upper(),
                      route
                  )


                  print(
                      "SUMMARY:",
                      spec.get("summary")
                  )


                  print(
                      "DESCRIPTION:",
                      (
                          spec.get(
                              "description"
                          )
                          or ""
                      )[:1000]
                  )


          if not found:

              print(
                  "OpenAPI 中没有找到 /auth/ 路由"
              )

          PY


      # =========================================================
      # 9. QuantMind 登录
      # =========================================================

      - name: 9. QuantMind 登录认证

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "QuantMind 登录认证"
          echo "========================================================="


          LOGIN_URL="$QUANTMIND_URL/api/v1/auth/login"


          echo "登录地址：$LOGIN_URL"

          echo "Tenant ID：$QUANTMIND_TENANT_ID"

          echo "Username：$QUANTMIND_USERNAME"

          echo "Password：已隐藏"


          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/quantmind_login.json \
            -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            "$LOGIN_URL" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            -d "{
              \"username\": \"$QUANTMIND_USERNAME\",
              \"password\": \"$QUANTMIND_PASSWORD\"
            }")


          echo
          echo "登录 HTTP 状态码：$HTTP_CODE"


          if [ "$HTTP_CODE" != "200" ]; then

            echo
            echo "========================================================="
            echo "QuantMind 登录失败"
            echo "========================================================="

            cat /tmp/quantmind_login.json || true

            exit 1

          fi


          python3 - <<'PY'

          import json
          import sys


          path = "/tmp/quantmind_login.json"


          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          token = data.get(
              "access_token"
          )


          if not token:

              print(
                  "错误：登录返回中没有 access_token"
              )

              print(
                  "返回字段：",
                  list(data.keys())
              )

              sys.exit(1)


          print()
          print(
              "========================================================="
          )

          print(
              "QuantMind 登录成功"
          )

          print(
              "Access Token：已获取"
          )

          print(
              "========================================================="
          )


          with open(
              "/tmp/quantmind_token.txt",
              "w"
          ) as f:

              f.write(token)

          PY


      # =========================================================
      # 10. 验证当前用户
      # =========================================================

      - name: 10. 验证 QuantMind 当前用户

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "验证当前用户"
          echo "========================================================="


          TOKEN=$(cat /tmp/quantmind_token.txt)


          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/quantmind_me.json \
            -w "%{http_code}" \
            --max-time 60 \
            "$QUANTMIND_URL/api/v1/users/me" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")


          echo "用户 API HTTP 状态码：$HTTP_CODE"


          if [ "$HTTP_CODE" != "200" ]; then

            echo
            echo "Token 验证失败"

            cat /tmp/quantmind_me.json || true

            exit 1

          fi


          echo
          echo "Token 验证成功"


          python3 - <<'PY'

          import json


          with open(
              "/tmp/quantmind_me.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print()
          print(
              "当前用户信息："
          )


          safe_keys = [
              "id",
              "username",
              "email",
              "tenant_id",
              "is_active",
              "is_superuser",
              "role"
          ]


          for key in safe_keys:

              if key in data:

                  print(
                      f"{key}: {data[key]}"
                  )

          PY


      # =========================================================
      # 11. 模型 API 检查
      # =========================================================

      - name: 11. QuantMind 模型 API 检查

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "QuantMind 模型 API"
          echo "========================================================="


          TOKEN=$(cat /tmp/quantmind_token.txt)


          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/quantmind_models.json \
            -w "%{http_code}" \
            --max-time 60 \
            "$QUANTMIND_URL/api/v1/models" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")


          echo
          echo "模型 API HTTP 状态码：$HTTP_CODE"


          if [ "$HTTP_CODE" = "200" ]; then

            echo
            echo "模型 API 正常"

            cat /tmp/quantmind_models.json

          else

            echo
            echo "模型 API 返回 HTTP $HTTP_CODE"

            cat /tmp/quantmind_models.json || true

            echo
            echo "登录和认证已经成功。"

          fi


      # =========================================================
      # 12. 推理前置检查
      # =========================================================

      - name: 12. QuantMind 推理前置检查

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "QuantMind 推理前置检查"
          echo "========================================================="


          TOKEN=$(cat /tmp/quantmind_token.txt)


          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/quantmind_precheck.json \
            -w "%{http_code}" \
            --max-time 60 \
            "$QUANTMIND_URL/api/v1/models/inference/precheck" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            || true)


          echo
          echo "Inference Precheck HTTP 状态码：$HTTP_CODE"


          cat /tmp/quantmind_precheck.json || true


          echo
          echo "这里只进行推理前置检查。"

          echo "不会自动执行真实交易或下单。"


      # =========================================================
      # 13. Stock Terminal API 检查
      # =========================================================

      - name: 13. Stock Terminal API 检查

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "Stock Terminal API"
          echo "========================================================="


          python3 - <<'PY'

          import json


          with open(
              "/tmp/quantmind_openapi.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          route = "/api/v1/stock-terminal/list"


          spec = (
              data
              .get("paths", {})
              .get(route, {})
              .get("get")
          )


          if not spec:

              print(
                  "没有找到：",
                  route
              )

              raise SystemExit(0)


          print(
              "接口：",
              route
          )


          print(
              "Summary:",
              spec.get("summary")
          )


          print(
              "Description:",
              spec.get("description")
          )


          print()
          print("参数：")


          for p in spec.get(
              "parameters",
              []
          ):

              print(
                  p.get("name"),
                  "|",
                  p.get("in"),
                  "| required=",
                  p.get("required"),
                  "| default=",
                  (
                      p.get("schema", {})
                      .get("default")
                  )
              )

          PY


      # =========================================================
      # 14. Market Calendar API 检查
      # =========================================================

      - name: 14. Market Calendar API 检查

        shell: bash

        run: |

          set -e

          echo "========================================================="
          echo "Market Calendar API"
          echo "========================================================="


          python3 - <<'PY'

          import json


          with open(
              "/tmp/quantmind_openapi.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          route = (
              "/api/v1/stock-terminal/"
              "market-calendar"
          )


          spec = (
              data
              .get("paths", {})
              .get(route, {})
              .get("get")
          )


          if not spec:

              print(
                  "没有找到：",
                  route
              )

              raise SystemExit(0)


          print(
              "接口：",
              route
          )


          print(
              "Summary:",
              spec.get("summary")
          )


          print(
              "Description:",
              spec.get("description")
          )


          print()
          print("参数：")


          for p in spec.get(
              "parameters",
              []
          ):

              print(
                  p.get("name"),
                  "|",
                  p.get("in"),
                  "| required=",
                  p.get("required"),
                  "| default=",
                  (
                      p.get("schema", {})
                      .get("default")
                  )
              )

          PY


      # =========================================================
      # 15. 最终 Docker 状态
      # =========================================================

      - name: 15. 最终 Docker 状态

        if: always()

        shell: bash

        run: |

          echo "========================================================="
          echo "QuantMind 最终 Docker 状态"
          echo "========================================================="


          if [ -d "/opt/quantmind" ]; then

            cd /opt/quantmind

            docker compose ps

          fi


      # =========================================================
      # 16. 失败时输出 QuantMind 日志
      # =========================================================

      - name: 16. 失败时输出 QuantMind 日志

        if: failure()

        shell: bash

        run: |

          echo "========================================================="
          echo "QuantMind 失败日志"
          echo "========================================================="


          if [ -d "/opt/quantmind" ]; then

            cd /opt/quantmind


            docker compose logs \
              --tail=300 \
              quantmind || true


            echo
            echo "Celery 日志："


            docker compose logs \
              --tail=200 \
              quantmind-celery || true


            echo
            echo "Celery Beat 日志："


            docker compose logs \
              --tail=200 \
              quantmind-celery-beat || true

          fi


      # =========================================================
      # 17. 清理临时认证文件
      # =========================================================

      - name: 17. 清理临时认证文件

        if: always()

        shell: bash

        run: |

          rm -f /tmp/quantmind_token.txt

          rm -f /tmp/quantmind_login.json

          rm -f /tmp/quantmind_me.json

          rm -f /tmp/quantmind_models.json

          rm -f /tmp/quantmind_precheck.json

          rm -f /tmp/quantmind_health.json

          rm -f /tmp/quantmind_openapi.json


          echo "临时认证文件已清理"


      # =========================================================
      # 重要：
      #
      # 正式运行版本不执行：
      #
      # docker compose down
      #
      # 因为你需要每天运行一次，
      # 而不是在 Workflow 中主动关闭 QuantMind。
      # =========================================================
