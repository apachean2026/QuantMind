name: QuantMind 每日自动选股

on:
  workflow_dispatch:

  schedule:
    # 北京时间周一至周五 15:30
    # GitHub Actions 使用 UTC
    # 北京时间 = UTC + 8
    - cron: "30 7 * * 1-5"

jobs:
  quantmind:
    runs-on: ubuntu-22.04

    env:
      QUANTMIND_TENANT_ID: ${{ secrets.QUANTMIND_TENANT_ID }}
      QUANTMIND_USERNAME: ${{ secrets.QUANTMIND_USERNAME }}
      QUANTMIND_PASSWORD: ${{ secrets.QUANTMIND_PASSWORD }}
      QUANTMIND_URL: http://127.0.0.1:8000

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: 1. Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. 检查系统环境
      # =========================================================
      - name: 2. 检查系统环境
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind GitHub Actions 环境"
          echo "========================================================="

          echo
          echo "当前目录："
          pwd

          echo
          echo "Python："
          python3 --version

          echo
          echo "Docker："
          docker --version

          echo
          echo "Docker Compose："
          docker compose version


      # =========================================================
      # 3. 检查 Secrets
      # =========================================================
      - name: 3. 检查 QuantMind Secrets
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "检查 QuantMind Secrets"
          echo "========================================================="

          if [ -z "$QUANTMIND_TENANT_ID" ]; then
            echo "❌ QUANTMIND_TENANT_ID 未配置"
            exit 1
          fi

          if [ -z "$QUANTMIND_USERNAME" ]; then
            echo "❌ QUANTMIND_USERNAME 未配置"
            exit 1
          fi

          if [ -z "$QUANTMIND_PASSWORD" ]; then
            echo "❌ QUANTMIND_PASSWORD 未配置"
            exit 1
          fi

          echo "✅ QUANTMIND_TENANT_ID：已配置"
          echo "✅ QUANTMIND_USERNAME：已配置"
          echo "✅ QUANTMIND_PASSWORD：已配置"


      # =========================================================
      # 4. 官方部署 QuantMind
      # =========================================================
      - name: 4. 部署 QuantMind
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "开始部署 QuantMind"
          echo "========================================================="

          if [ ! -f "deploy/full-deploy.sh" ]; then
            echo "❌ 没有找到 deploy/full-deploy.sh"

            echo
            echo "当前目录："
            pwd

            echo
            echo "目录内容："
            ls -la

            exit 1
          fi

          echo "✅ 找到官方部署脚本"

          sudo bash deploy/full-deploy.sh


      # =========================================================
      # 5. Docker 服务状态
      # =========================================================
      - name: 5. 检查 Docker 服务
        shell: bash
        run: |
          set +e

          echo "========================================================="
          echo "Docker 服务状态"
          echo "========================================================="

          docker ps -a

          echo
          echo "Docker Compose："

          docker compose ps 2>/dev/null || true


      # =========================================================
      # 6. 等待 QuantMind API
      # =========================================================
      - name: 6. 等待 QuantMind API
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "等待 QuantMind API"
          echo "========================================================="

          for i in $(seq 1 60); do

            echo
            echo "第 ${i}/60 次检查"

            HTTP_CODE=$(curl \
              -s \
              -o /tmp/quantmind_health.json \
              -w "%{http_code}" \
              "$QUANTMIND_URL/health" \
              || true)

            echo "HTTP 状态码：$HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then

              echo
              echo "✅ QuantMind API 已启动"

              echo
              echo "Health 返回："

              cat /tmp/quantmind_health.json || true

              exit 0
            fi

            sleep 5

          done

          echo
          echo "❌ QuantMind API 启动超时"

          echo
          echo "Docker 状态："

          docker ps -a

          echo
          echo "Docker Compose："

          docker compose ps 2>/dev/null || true

          exit 1


      # =========================================================
      # 7. 获取 OpenAPI
      # =========================================================
      - name: 7. 获取 QuantMind OpenAPI
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "获取 QuantMind OpenAPI"
          echo "========================================================="

          curl \
            -fsS \
            "$QUANTMIND_URL/openapi.json" \
            -o /tmp/quantmind_openapi.json

          if [ ! -s /tmp/quantmind_openapi.json ]; then
            echo "❌ OpenAPI 文件为空"
            exit 1
          fi

          echo "✅ OpenAPI 获取成功"

          echo
          echo "OpenAPI 文件大小："

          wc -c /tmp/quantmind_openapi.json


      # =========================================================
      # 8. 检查关键 API
      # =========================================================
      - name: 8. 检查 QuantMind 关键 API
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 关键 API"
          echo "========================================================="

          python3 - <<'PY'
          import json

          path = "/tmp/quantmind_openapi.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          targets = [
              "/api/v1/auth/login",
              "/api/v1/users/me",
              "/api/v1/models",
              "/api/v1/models/inference/precheck",
              "/api/v1/models/inference/run",
              "/api/v1/models/inference/latest",
              "/api/v1/models/inference/runs",
          ]

          print()

          for target in targets:

              if target in paths:
                  print(f"✅ {target}")
              else:
                  print(f"⚠️ 未找到 {target}")

          print()
          print("=========================================================")
          print("真实推理接口")
          print("=========================================================")

          endpoint = "/api/v1/models/inference/run"

          if endpoint in paths:

              operation = paths[endpoint].get("post", {})

              print("METHOD: POST")
              print("PATH:", endpoint)
              print("SUMMARY:", operation.get("summary"))

              print()
              print("REQUEST BODY:")

              print(
                  json.dumps(
                      operation.get("requestBody"),
                      ensure_ascii=False,
                      indent=2
                  )
              )

          else:

              print("❌ 没有找到模型推理接口")
              raise SystemExit(1)


      # =========================================================
      # 9. QuantMind 登录
      # =========================================================
      - name: 9. QuantMind 登录认证
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 登录认证"
          echo "========================================================="

          LOGIN_URL="$QUANTMIND_URL/api/v1/auth/login"

          echo
          echo "登录地址：$LOGIN_URL"
          echo "Tenant ID：已隐藏"
          echo "Username：已隐藏"
          echo "Password：已隐藏"

          cat > /tmp/login.json <<EOF
          {
            "tenant_id": "$QUANTMIND_TENANT_ID",
            "username": "$QUANTMIND_USERNAME",
            "password": "$QUANTMIND_PASSWORD"
          }
          EOF

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/login_response.json \
            -w "%{http_code}" \
            -X POST \
            "$LOGIN_URL" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            --data @/tmp/login.json)

          echo
          echo "登录 HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then

            echo
            echo "❌ QuantMind 登录失败"

            echo
            echo "服务器返回："

            cat /tmp/login_response.json

            exit 1
          fi

          python3 - <<'PY'
          import json

          path = "/tmp/login_response.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          token = data.get("access_token")

          if not token:

              print("❌ 登录成功，但没有找到 access_token")

              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              raise SystemExit(1)

          with open(
              "/tmp/quantmind_token.txt",
              "w"
          ) as f:

              f.write(token)

          print()
          print("✅ QuantMind 登录成功")
          print("Access Token：已获取")
          PY

          rm -f /tmp/login.json


      # =========================================================
      # 10. 验证当前用户
      # =========================================================
      - name: 10. 验证当前用户
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "验证 QuantMind 当前用户"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/current_user.json \
            -w "%{http_code}" \
            "$QUANTMIND_URL/api/v1/users/me" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

          echo
          echo "HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then

            echo "❌ 当前用户验证失败"

            cat /tmp/current_user.json

            exit 1
          fi

          echo "✅ 当前用户验证成功"


      # =========================================================
      # 11. 获取模型
      # =========================================================
      - name: 11. 获取 QuantMind 模型
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 模型列表"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/models.json \
            -w "%{http_code}" \
            "$QUANTMIND_URL/api/v1/models" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

          echo
          echo "HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then

            echo "❌ 获取模型失败"

            cat /tmp/models.json

            exit 1
          fi

          echo
          echo "========================================================="
          echo "QuantMind 模型返回"
          echo "========================================================="

          cat /tmp/models.json

          echo
          echo "========================================================="
          echo "解析 model_id"
          echo "========================================================="

          python3 - <<'PY'
          import json
          import os

          path = "/tmp/models.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          candidates = []

          if isinstance(data, list):

              candidates = data

          elif isinstance(data, dict):

              for key in [
                  "data",
                  "items",
                  "models",
                  "results"
              ]:

                  value = data.get(key)

                  if isinstance(value, list):

                      candidates = value

                      break

              if not candidates and data.get("id"):

                  candidates = [data]

          print()
          print("模型数量：", len(candidates))

          if not candidates:

              print("❌ 没有发现模型")

              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              raise SystemExit(1)

          selected = None

          for index, model in enumerate(candidates, 1):

              print()
              print(
                  f"---------------- 模型 {index} ----------------"
              )

              if isinstance(model, dict):

                  print("id:", model.get("id"))
                  print("model_id:", model.get("model_id"))
                  print("name:", model.get("name"))
                  print("status:", model.get("status"))
                  print("type:", model.get("type"))

                  candidate_id = (
                      model.get("model_id")
                      or model.get("id")
                  )

                  if candidate_id and selected is None:

                      selected = str(candidate_id)

              else:

                  print(model)

          if not selected:

              print()
              print("❌ 没有找到可用 model_id")

              raise SystemExit(1)

          print()
          print("=========================================================")
          print("最终使用 model_id")
          print("=========================================================")

          print(selected)

          with open(
              "/tmp/quantmind_model_id.txt",
              "w"
          ) as f:

              f.write(selected)

          github_env = os.environ.get(
              "GITHUB_ENV"
          )

          if github_env:

              with open(
                  github_env,
                  "a"
              ) as f:

                  f.write(
                      f"QUANTMIND_MODEL_ID={selected}\n"
                  )

          print()
          print("✅ model_id 获取成功")


      # =========================================================
      # 12. 推理前置检查
      # =========================================================
      - name: 12. 推理前置检查
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 推理前置检查"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)
          MODEL_ID=$(cat /tmp/quantmind_model_id.txt)

          echo
          echo "model_id：$MODEL_ID"

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/precheck.json \
            -w "%{http_code}" \
            --get \
            "$QUANTMIND_URL/api/v1/models/inference/precheck" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            --data-urlencode "model_id=$MODEL_ID")

          echo
          echo "HTTP 状态码：$HTTP_CODE"

          echo
          echo "========================================================="
          echo "Precheck 返回"
          echo "========================================================="

          cat /tmp/precheck.json

          echo

          if [ "$HTTP_CODE" != "200" ]; then

            echo "❌ 推理前置检查失败"

            exit 1
          fi

          echo
          echo "✅ 推理前置检查通过"


      # =========================================================
      # 13. 确定推理日期
      # =========================================================
      - name: 13. 确定推理日期
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "确定 QuantMind 推理日期"
          echo "========================================================="

          # GitHub Runner 默认 UTC。
          # QuantMind 的 inference_date 使用 YYYY-MM-DD。
          #
          # 北京时间 15:30 对应 UTC 07:30，
          # 所以这里使用北京时间日期。
          #
          INFERENCE_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)

          echo
          echo "推理日期：$INFERENCE_DATE"

          echo "$INFERENCE_DATE" \
            > /tmp/quantmind_inference_date.txt

          echo "INFERENCE_DATE=$INFERENCE_DATE" >> "$GITHUB_ENV"

          echo
          echo "✅ 推理日期确定"


      # =========================================================
      # 14. 执行真正的模型推理
      #
      # 已经根据 OpenAPI 确认：
      #
      # model_id       必填
      # inference_date 必填
      # pool_id        可选
      #
      # 当前 pool_id 使用 null。
      # =========================================================
      - name: 14. 执行 QuantMind 模型推理
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "执行 QuantMind 模型推理"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)
          MODEL_ID=$(cat /tmp/quantmind_model_id.txt)
          INFERENCE_DATE=$(cat /tmp/quantmind_inference_date.txt)

          echo
          echo "model_id：$MODEL_ID"
          echo "inference_date：$INFERENCE_DATE"
          echo "pool_id：null"

          cat > /tmp/inference_request.json <<EOF
          {
            "model_id": "$MODEL_ID",
            "inference_date": "$INFERENCE_DATE",
            "pool_id": null
          }
          EOF

          echo
          echo "请求 JSON："

          cat /tmp/inference_request.json

          echo
          echo "提交模型推理..."

          HTTP_CODE=$(curl \
            -s \
            -o /tmp/inference_response.json \
            -w "%{http_code}" \
            -X POST \
            "$QUANTMIND_URL/api/v1/models/inference/run" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            -H "Content-Type: application/json" \
            --data @/tmp/inference_request.json)

          echo
          echo "HTTP 状态码：$HTTP_CODE"

          echo
          echo "========================================================="
          echo "模型推理返回"
          echo "========================================================="

          cat /tmp/inference_response.json

          echo

          if [ "$HTTP_CODE" != "200" ] && \
             [ "$HTTP_CODE" != "201" ] && \
             [ "$HTTP_CODE" != "202" ]; then

            echo
            echo "❌ 模型推理提交失败"

            exit 1
          fi

          echo
          echo "✅ 模型推理请求提交成功"


      # =========================================================
      # 15. 自动提取 run_id
      # =========================================================
      - name: 15. 获取推理 run_id
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "获取 QuantMind 推理 run_id"
          echo "========================================================="

          python3 - <<'PY'
          import json

          path = "/tmp/inference_response.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print()
          print("推理响应结构：")
          print(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              )
          )

          candidates = []

          def collect(obj):
              if isinstance(obj, dict):

                  for key in [
                      "run_id",
                      "id",
                      "inference_run_id"
                  ]:

                      value = obj.get(key)

                      if value is not None:
                          candidates.append(str(value))

                  for key in [
                      "data",
                      "result",
                      "run",
                      "inference"
                  ]:

                      if key in obj:
                          collect(obj[key])

              elif isinstance(obj, list):

                  for item in obj:
                      collect(item)

          collect(data)

          # 去重，同时保持顺序
          seen = set()
          unique = []

          for value in candidates:

              if value not in seen:

                  seen.add(value)
                  unique.append(value)

          print()
          print("发现可能的 run_id：")

          for value in unique:
              print(value)

          if not unique:

              print()
              print("⚠️ 返回中没有明确发现 run_id")

              print()
              print(
                  "后续将尝试使用 latest 接口查询当前推理批次。"
              )

              with open(
                  "/tmp/quantmind_run_id.txt",
                  "w"
              ) as f:

                  f.write("")

          else:

              run_id = unique[0]

              with open(
                  "/tmp/quantmind_run_id.txt",
                  "w"
              ) as f:

                  f.write(run_id)

              print()
              print("✅ 使用 run_id：", run_id)
          PY


      # =========================================================
      # 16. 等待推理完成 / 查询推理结果
      # =========================================================
      - name: 16. 等待 QuantMind 推理结果
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "等待 QuantMind 推理结果"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)
          RUN_ID=$(cat /tmp/quantmind_run_id.txt)

          if [ -n "$RUN_ID" ]; then

            echo
            echo "使用 run_id：$RUN_ID"

            for i in $(seq 1 60); do

              echo
              echo "第 ${i}/60 次查询"

              HTTP_CODE=$(curl \
                -s \
                -o /tmp/inference_detail.json \
                -w "%{http_code}" \
                "$QUANTMIND_URL/api/v1/models/inference/runs/$RUN_ID" \
                -H "Authorization: Bearer $TOKEN" \
                -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
                || true)

              echo "HTTP 状态码：$HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then

                python3 - <<'PY'
          import json

          path = "/tmp/inference_detail.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print()
          print("当前推理状态：")

          print(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # 尝试识别状态
          status = None

          if isinstance(data, dict):

              for key in [
                  "status",
                  "state",
                  "run_status"
              ]:

                  if data.get(key) is not None:

                      status = str(
                          data.get(key)
                      ).lower()

                      break

              if status is None:

                  for key in [
                      "data",
                      "result",
                      "run"
                  ]:

                      value = data.get(key)

                      if isinstance(value, dict):

                          for status_key in [
                              "status",
                              "state",
                              "run_status"
                          ]:

                              if value.get(status_key) is not None:

                                  status = str(
                                      value.get(status_key)
                                  ).lower()

                                  break

                          if status:
                              break

          print()
          print("识别状态：", status)

          # 写入状态供 Bash 使用
          with open(
              "/tmp/inference_status.txt",
              "w"
          ) as f:

              f.write(status or "unknown")
          PY

                STATUS=$(cat /tmp/inference_status.txt)

                case "$STATUS" in

                  completed|success|succeeded|finished|done)
                    echo
                    echo "✅ QuantMind 推理完成"
                    exit 0
                    ;;

                  failed|error|cancelled|canceled)
                    echo
                    echo "❌ QuantMind 推理失败"
                    exit 1
                    ;;

                  *)
                    echo
                    echo "推理尚未完成，等待 10 秒..."
                    sleep 10
                    ;;
                esac

              else

                echo "暂时无法读取推理详情，等待 10 秒..."
                sleep 10

              fi

            done

            echo
            echo "❌ 等待推理完成超时"
            exit 1

          else

            echo
            echo "没有从提交响应中发现 run_id。"
            echo "尝试使用 latest 接口。"

            HTTP_CODE=$(curl \
              -s \
              -o /tmp/inference_latest.json \
              -w "%{http_code}" \
              "$QUANTMIND_URL/api/v1/models/inference/latest?model_id=$MODEL_ID" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
              || true)

            echo
            echo "latest HTTP 状态码：$HTTP_CODE"

            echo
            echo "latest 返回："

            cat /tmp/inference_latest.json

            if [ "$HTTP_CODE" != "200" ]; then

              echo
              echo "❌ 无法获取最新推理批次"
              exit 1

            fi

          fi


      # =========================================================
      # 17. 输出最终推理结果
      # =========================================================
      - name: 17. 输出 QuantMind 选股结果
        shell: bash
        run: |
          set -e

          echo "========================================================="
          echo "QuantMind 每日选股结果"
          echo "========================================================="

          echo
          echo "推理日期：$INFERENCE_DATE"

          if [ -f /tmp/inference_detail.json ]; then

            echo
            echo "========================================================="
            echo "推理结果"
            echo "========================================================="

            cat /tmp/inference_detail.json

          elif [ -f /tmp/inference_latest.json ]; then

            echo
            echo "========================================================="
            echo "最新推理结果"
            echo "========================================================="

            cat /tmp/inference_latest.json

          else

            echo
            echo "⚠️ 没有找到推理结果文件"

          fi

          echo
          echo "========================================================="
          echo "QuantMind 自动选股流程结束"
          echo "========================================================="


      # =========================================================
      # 18. 最终 Docker 状态
      # =========================================================
      - name: 18. 最终 Docker 状态
        if: always()
        shell: bash
        run: |
          echo "========================================================="
          echo "最终 Docker 状态"
          echo "========================================================="

          docker ps -a || true

          echo
          echo "Docker Compose："

          docker compose ps 2>/dev/null || true


      # =========================================================
      # 19. 失败诊断
      # =========================================================
      - name: 19. QuantMind 失败诊断
        if: failure()
        shell: bash
        run: |
          echo "========================================================="
          echo "QuantMind 失败诊断"
          echo "========================================================="

          echo
          echo "Docker 容器："

          docker ps -a || true

          echo
          echo "Docker Compose："

          docker compose ps 2>/dev/null || true

          echo
          echo "最近容器日志："

          for container in $(docker ps -aq); do

            echo
            echo "---------------------------------------------------------"
            echo "CONTAINER: $container"
            echo "---------------------------------------------------------"

            docker logs \
              --tail 100 \
              "$container" \
              2>&1 || true

          done


      # =========================================================
      # 20. 清理临时认证文件
      # =========================================================
      - name: 20. 清理临时文件
        if: always()
        shell: bash
        run: |
          rm -f /tmp/quantmind_token.txt
          rm -f /tmp/quantmind_model_id.txt
          rm -f /tmp/quantmind_inference_date.txt
          rm -f /tmp/login.json
          rm -f /tmp/login_response.json
          rm -f /tmp/current_user.json
          rm -f /tmp/inference_request.json
