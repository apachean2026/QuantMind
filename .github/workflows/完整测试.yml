name: QuantMind 每日自动选股

on:
  workflow_dispatch:

  schedule:
    # 北京时间周一至周五 15:30
    # GitHub Actions 使用 UTC
    # 北京时间 = UTC + 8
    - cron: "30 7 * * 1-5"

jobs:

  quantmind:
    runs-on: ubuntu-22.04

    env:
      QUANTMIND_TENANT_ID: ${{ secrets.QUANTMIND_TENANT_ID }}
      QUANTMIND_USERNAME: ${{ secrets.QUANTMIND_USERNAME }}
      QUANTMIND_PASSWORD: ${{ secrets.QUANTMIND_PASSWORD }}
      QUANTMIND_URL: http://127.0.0.1:8000

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. 基础环境检查
      # =========================================================
      - name: 检查运行环境
        run: |
          echo "========================================================="
          echo "QuantMind GitHub Actions"
          echo "========================================================="

          echo ""
          echo "系统："
          uname -a

          echo ""
          echo "Python："
          python3 --version || true

          echo ""
          echo "Docker："
          docker --version

          echo ""
          echo "磁盘空间："
          df -h


      # =========================================================
      # 3. 检查 Secrets
      # =========================================================
      - name: 检查 QuantMind Secrets
        run: |
          echo "========================================================="
          echo "检查 Secrets"
          echo "========================================================="

          if [ -z "$QUANTMIND_TENANT_ID" ]; then
            echo "❌ QUANTMIND_TENANT_ID 未配置"
            exit 1
          fi

          if [ -z "$QUANTMIND_USERNAME" ]; then
            echo "❌ QUANTMIND_USERNAME 未配置"
            exit 1
          fi

          if [ -z "$QUANTMIND_PASSWORD" ]; then
            echo "❌ QUANTMIND_PASSWORD 未配置"
            exit 1
          fi

          echo "✅ QUANTMIND_TENANT_ID 已配置"
          echo "✅ QUANTMIND_USERNAME 已配置"
          echo "✅ QUANTMIND_PASSWORD 已配置"


      # =========================================================
      # 4. 启动 QuantMind
      # =========================================================
      - name: 部署并启动 QuantMind
        run: |
          echo "========================================================="
          echo "启动 QuantMind"
          echo "========================================================="

          if [ ! -f deploy/full-deploy.sh ]; then
            echo "❌ 找不到 deploy/full-deploy.sh"
            echo "当前目录："
            pwd
            echo ""
            echo "目录内容："
            ls -lah
            exit 1
          fi

          sudo bash deploy/full-deploy.sh


      # =========================================================
      # 5. 查看 Docker
      # =========================================================
      - name: 检查 Docker 容器
        run: |
          echo "========================================================="
          echo "Docker 容器状态"
          echo "========================================================="

          docker ps -a

          echo ""
          echo "QuantMind 相关容器："

          docker ps -a \
            --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}' \
            | grep -Ei 'quantmind|quant' || true


      # =========================================================
      # 6. 等待 QuantMind HTTP 服务
      # =========================================================
      - name: 等待 QuantMind 服务
        run: |
          echo "========================================================="
          echo "等待 QuantMind HTTP 服务"
          echo "========================================================="

          for i in $(seq 1 60); do

            HTTP_CODE=$(curl -s \
              -o /tmp/quantmind_health.json \
              -w "%{http_code}" \
              "$QUANTMIND_URL/health" || true)

            echo "第 $i/60 次检查，HTTP 状态码：$HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ QuantMind 服务已经启动"

              echo ""
              echo "Health 返回："
              cat /tmp/quantmind_health.json || true

              break
            fi

            if [ "$i" = "60" ]; then
              echo "❌ QuantMind 服务启动超时"

              echo ""
              echo "Docker 状态："
              docker ps -a

              exit 1
            fi

            sleep 5
          done


      # =========================================================
      # 7. OpenAPI 检查
      # =========================================================
      - name: 检查 QuantMind OpenAPI
        run: |
          echo "========================================================="
          echo "检查 OpenAPI"
          echo "========================================================="

          HTTP_CODE=$(curl -s \
            -o /tmp/openapi.json \
            -w "%{http_code}" \
            "$QUANTMIND_URL/openapi.json")

          echo "HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ OpenAPI 获取失败"
            cat /tmp/openapi.json || true
            exit 1
          fi

          echo "✅ OpenAPI 正常"

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          paths = data.get("paths", {})

          targets = [
              "/api/v1/models",
              "/api/v1/models/inference/precheck",
              "/api/v1/models/inference/run",
              "/api/v1/models/inference/latest",
              "/api/v1/models/inference/runs",
          ]

          print("")
          print("关键 API：")

          for path in targets:
              if path in paths:
                  print(f"✅ {path}")
              else:
                  print(f"⚠️ {path} 未找到")
          PY


      # =========================================================
      # 8. 登录 QuantMind
      # =========================================================
      - name: 登录 QuantMind
        run: |
          echo "========================================================="
          echo "QuantMind 登录"
          echo "========================================================="

          LOGIN_PAYLOAD=$(python3 - <<'PY'
          import json
          import os

          payload = {
              "tenant_id": os.environ["QUANTMIND_TENANT_ID"],
              "username": os.environ["QUANTMIND_USERNAME"],
              "password": os.environ["QUANTMIND_PASSWORD"]
          }

          print(json.dumps(payload))
          PY
          )

          HTTP_CODE=$(curl -s \
            -o /tmp/quantmind_login.json \
            -w "%{http_code}" \
            -X POST \
            "$QUANTMIND_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            -d "$LOGIN_PAYLOAD")

          echo "登录 HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ QuantMind 登录失败"
            cat /tmp/quantmind_login.json
            exit 1
          fi

          TOKEN=$(python3 - <<'PY'
          import json

          with open("/tmp/quantmind_login.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          token = (
              data.get("access_token")
              or data.get("token")
              or data.get("data", {}).get("access_token")
              or data.get("data", {}).get("token")
          )

          if not token:
              raise SystemExit("没有找到 access_token")

          print(token)
          PY
          )

          if [ -z "$TOKEN" ]; then
            echo "❌ TOKEN 为空"
            cat /tmp/quantmind_login.json
            exit 1
          fi

          printf '%s' "$TOKEN" > /tmp/quantmind_token.txt

          echo "✅ QuantMind 登录成功"


      # =========================================================
      # 9. 验证当前用户
      # =========================================================
      - name: 验证 QuantMind 用户
        run: |
          echo "========================================================="
          echo "验证当前用户"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          HTTP_CODE=$(curl -s \
            -o /tmp/quantmind_me.json \
            -w "%{http_code}" \
            "$QUANTMIND_URL/api/v1/users/me" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

          echo "HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 用户验证失败"
            cat /tmp/quantmind_me.json
            exit 1
          fi

          echo "✅ 用户验证成功"

          cat /tmp/quantmind_me.json


      # =========================================================
      # 10. 检查 QuantDB
      # =========================================================
      - name: 检查 QuantDB 数据
        run: |
          echo "========================================================="
          echo "检查 QuantDB"
          echo "========================================================="

          echo ""
          echo "【1】Docker 容器"
          docker ps -a

          echo ""
          echo "【2】QuantMind 相关容器"

          docker ps -a \
            --format '{{.ID}} {{.Names}} {{.Status}}' \
            | grep -Ei 'quantmind|quant' || true

          echo ""
          echo "【3】宿主机 /data"

          sudo ls -lah /data || true

          echo ""
          echo "【4】宿主机 /data/quantdb"

          sudo ls -lah /data/quantdb || true

          echo ""
          echo "【5】查找 /data 下的数据文件"

          sudo find /data \
            -maxdepth 4 \
            -type f \
            2>/dev/null \
            | head -200 || true

          echo ""
          echo "【6】进入 QuantMind 容器检查 /data/quantdb"

          CONTAINER_ID=$(docker ps \
            --format '{{.ID}} {{.Names}}' \
            | grep -Ei 'quantmind|quant' \
            | head -1 \
            | awk '{print $1}')

          if [ -z "$CONTAINER_ID" ]; then
            echo "❌ 没有找到 QuantMind 容器"
          else

            echo "QuantMind 容器：$CONTAINER_ID"

            docker exec "$CONTAINER_ID" sh -c '
              echo "===== /data ====="
              ls -lah /data 2>&1 || true

              echo ""
              echo "===== /data/quantdb ====="
              ls -lah /data/quantdb 2>&1 || true

              echo ""
              echo "===== QuantDB 文件 ====="
              find /data/quantdb \
                -maxdepth 4 \
                -type f \
                2>/dev/null \
                | head -200 || true
            '

          fi


      # =========================================================
      # 11. 获取模型列表
      # =========================================================
      - name: 获取 QuantMind 模型
        run: |
          echo "========================================================="
          echo "获取模型列表"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          HTTP_CODE=$(curl -s \
            -o /tmp/quantmind_models.json \
            -w "%{http_code}" \
            "$QUANTMIND_URL/api/v1/models" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

          echo "HTTP 状态码：$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 获取模型失败"
            cat /tmp/quantmind_models.json
            exit 1
          fi

          echo ""
          echo "模型列表："
          cat /tmp/quantmind_models.json

          MODEL_ID=$(python3 - <<'PY'
          import json

          with open("/tmp/quantmind_models.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = []

          if isinstance(data, list):
              items = data

          elif isinstance(data, dict):
              if isinstance(data.get("items"), list):
                  items = data["items"]

              elif isinstance(data.get("data"), list):
                  items = data["data"]

              elif isinstance(data.get("data"), dict):
                  if isinstance(data["data"].get("items"), list):
                      items = data["data"]["items"]

          model_id = None

          for item in items:
              if not isinstance(item, dict):
                  continue

              candidate = (
                  item.get("model_id")
                  or item.get("id")
              )

              if candidate:
                  model_id = candidate
                  break

          if not model_id:
              raise SystemExit("没有找到 model_id")

          print(model_id)
          PY
          )

          if [ -z "$MODEL_ID" ]; then
            echo "❌ MODEL_ID 为空"
            exit 1
          fi

          echo "MODEL_ID=$MODEL_ID" >> "$GITHUB_ENV"
          printf '%s' "$MODEL_ID" > /tmp/quantmind_model_id.txt

          echo ""
          echo "✅ 使用模型：$MODEL_ID"


      # =========================================================
      # 12. 推理前置检查
      # =========================================================
      - name: QuantMind 推理前置检查
        run: |
          echo "========================================================="
          echo "QuantMind 推理前置检查"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)
          MODEL_ID=$(cat /tmp/quantmind_model_id.txt)

          echo "模型：$MODEL_ID"

          HTTP_CODE=$(curl -s \
            -o /tmp/quantmind_precheck.json \
            -w "%{http_code}" \
            --get \
            "$QUANTMIND_URL/api/v1/models/inference/precheck" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            --data-urlencode "model_id=$MODEL_ID")

          echo "HTTP 状态码：$HTTP_CODE"

          echo ""
          echo "Precheck 返回："
          cat /tmp/quantmind_precheck.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo ""
            echo "❌ Precheck API 调用失败"
            exit 1
          fi

          PRECHECK_PASSED=$(python3 - <<'PY'
          import json

          with open("/tmp/quantmind_precheck.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data.get("passed"))

          print("\n========== Precheck 项目 ==========")

          for item in data.get("items", []):
              print(
                  f"[{item.get('passed')}] "
                  f"{item.get('key')} - "
                  f"{item.get('label')} - "
                  f"{item.get('detail')}"
              )
          PY
          )

          echo ""
          echo "$PRECHECK_PASSED"

          if echo "$PRECHECK_PASSED" | grep -q "^False$"; then
            echo ""
            echo "❌ QuantMind 推理前置检查没有通过"
            echo "上面的检查结果就是具体失败原因。"
            exit 1
          fi

          echo ""
          echo "✅ QuantMind Precheck 通过"


      # =========================================================
      # 13. 确定北京时间推理日期
      # =========================================================
      - name: 确定推理日期
        run: |
          echo "========================================================="
          echo "确定推理日期"
          echo "========================================================="

          INFERENCE_DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d')

          echo "北京时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "请求推理日期：$INFERENCE_DATE"

          echo "INFERENCE_DATE=$INFERENCE_DATE" >> "$GITHUB_ENV"
          printf '%s' "$INFERENCE_DATE" > /tmp/quantmind_inference_date.txt


      # =========================================================
      # 14. 执行模型推理
      # =========================================================
      - name: 执行 QuantMind 模型推理
        run: |
          echo "========================================================="
          echo "执行 QuantMind 模型推理"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)
          MODEL_ID=$(cat /tmp/quantmind_model_id.txt)
          INFERENCE_DATE=$(cat /tmp/quantmind_inference_date.txt)

          python3 - <<PY
          import json

          payload = {
              "model_id": "$MODEL_ID",
              "inference_date": "$INFERENCE_DATE",
              "pool_id": None
          }

          with open("/tmp/inference_request.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)

          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

          echo ""
          echo "发送推理请求..."

          HTTP_CODE=$(curl -s \
            -o /tmp/inference_run.json \
            -w "%{http_code}" \
            -X POST \
            "$QUANTMIND_URL/api/v1/models/inference/run" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Tenant-Id: $QUANTMIND_TENANT_ID" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/inference_request.json)

          echo ""
          echo "HTTP 状态码：$HTTP_CODE"

          echo ""
          echo "模型推理返回："
          cat /tmp/inference_run.json

          if [ "$HTTP_CODE" != "200" ] && \
             [ "$HTTP_CODE" != "201" ] && \
             [ "$HTTP_CODE" != "202" ]; then

            echo ""
            echo "❌ 推理接口调用失败"
            exit 1
          fi

          echo ""
          echo "✅ 推理请求已经提交"


      # =========================================================
      # 15. 获取推理 Run ID
      # =========================================================
      - name: 获取推理 Run ID
        run: |
          echo "========================================================="
          echo "获取推理 Run ID"
          echo "========================================================="

          python3 - <<'PY'
          import json

          with open("/tmp/inference_run.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("推理接口顶层字段：")
          print(list(data.keys()) if isinstance(data, dict) else type(data))

          run_id = None

          if isinstance(data, dict):

              run_id = (
                  data.get("run_id")
                  or data.get("inference_run_id")
              )

              if not run_id and isinstance(data.get("data"), dict):
                  run_id = (
                      data["data"].get("run_id")
                      or data["data"].get("inference_run_id")
                  )

              if not run_id and isinstance(data.get("result"), dict):
                  run_id = (
                      data["result"].get("run_id")
                      or data["result"].get("inference_run_id")
                  )

          if run_id:
              print("")
              print("RUN_ID =", run_id)

              with open("/tmp/quantmind_run_id.txt", "w", encoding="utf-8") as f:
                  f.write(str(run_id))

          else:
              print("")
              print("⚠️ 返回结果中没有找到 RUN_ID")
              print("可能接口已经同步返回结果。")
          PY


      # =========================================================
      # 16. 查询推理结果
      # =========================================================
      - name: 查询 QuantMind 推理结果
        run: |
          echo "========================================================="
          echo "查询 QuantMind 推理结果"
          echo "========================================================="

          TOKEN=$(cat /tmp/quantmind_token.txt)

          if [ -f /tmp/quantmind_run_id.txt ]; then

            RUN_ID=$(cat /tmp/quantmind_run_id.txt)

            echo "RUN_ID：$RUN_ID"

            echo ""
            echo "查询推理状态..."

            HTTP_CODE=$(curl -s \
              -o /tmp/inference_detail.json \
              -w "%{http_code}" \
              "$QUANTMIND_URL/api/v1/models/inference/runs/$RUN_ID" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

            echo ""
            echo "HTTP 状态码：$HTTP_CODE"

            echo ""
            echo "推理结果："
            cat /tmp/inference_detail.json

            if [ "$HTTP_CODE" != "200" ]; then
              echo ""
              echo "❌ 查询推理结果失败"
              exit 1
            fi

          else

            echo "没有 RUN_ID。"

            echo ""
            echo "使用最新推理结果接口..."

            HTTP_CODE=$(curl -s \
              -o /tmp/inference_latest.json \
              -w "%{http_code}" \
              "$QUANTMIND_URL/api/v1/models/inference/latest" \
              -H "Authorization: Bearer $TOKEN" \
              -H "X-Tenant-Id: $QUANTMIND_TENANT_ID")

            echo ""
            echo "HTTP 状态码：$HTTP_CODE"

            echo ""
            echo "最新推理结果："
            cat /tmp/inference_latest.json

            if [ "$HTTP_CODE" != "200" ]; then
              echo ""
              echo "❌ 获取最新推理结果失败"
              exit 1
            fi

          fi


      # =========================================================
      # 17. 最终分析推理结果
      # =========================================================
      - name: 分析推理结果
        run: |
          echo "========================================================="
          echo "分析 QuantMind 推理结果"
          echo "========================================================="

          RESULT_FILE=""

          if [ -f /tmp/inference_detail.json ]; then
            RESULT_FILE="/tmp/inference_detail.json"
          elif [ -f /tmp/inference_latest.json ]; then
            RESULT_FILE="/tmp/inference_latest.json"
          fi

          if [ -z "$RESULT_FILE" ]; then
            echo "❌ 没有找到推理结果文件"
            exit 1
          fi

          echo "结果文件：$RESULT_FILE"

          python3 - "$RESULT_FILE" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("========== QuantMind 推理最终结果 ==========")
          print(json.dumps(data, ensure_ascii=False, indent=2))

          summary = {}

          if isinstance(data, dict):
              summary = data.get("summary", {})

              if not summary and isinstance(data.get("data"), dict):
                  summary = data["data"].get("summary", {})

          status = summary.get("status")

          if status is None and isinstance(data, dict):
              status = data.get("status")

          success = summary.get("success")

          if success is None and isinstance(data, dict):
              success = data.get("success")

          print("")
          print("==============================================")
          print("最终状态：", status)
          print("success：", success)
          print("==============================================")

          # -----------------------------
          # 明确识别失败
          # -----------------------------
          if status in {"failed", "error"} or success is False:

              print("")
              print("❌ QuantMind 推理失败")

              failure_stage = summary.get("failure_stage")
              error_message = summary.get("error_message")
              fallback_reason = summary.get("fallback_reason")

              if failure_stage:
                  print("失败阶段：", failure_stage)

              if error_message:
                  print("错误原因：", error_message)

              if fallback_reason:
                  print("Fallback 原因：", fallback_reason)

              print("")
              print("这不是 GitHub Actions 超时。")
              print("这是 QuantMind 自己报告的推理失败。")

              raise SystemExit(1)

          # -----------------------------
          # 明确成功
          # -----------------------------
          if status in {
              "completed",
              "success",
              "succeeded",
              "finished",
              "done"
          } or success is True:

              print("")
              print("✅ QuantMind 推理成功")

              signals_count = (
                  summary.get("signals_count")
                  or summary.get("rows_count")
                  or 0
              )

              symbols_count = summary.get("symbols_count", 0)

              print("信号数量：", signals_count)
              print("股票数量：", symbols_count)

              raise SystemExit(0)

          # -----------------------------
          # 未知状态
          # -----------------------------
          print("")
          print("⚠️ 无法识别最终状态")
          print("但不会再进行 60 次无意义轮询。")
          print("请根据上面的完整 JSON 判断。")
          PY


      # =========================================================
      # 18. 输出 Docker 最终状态
      # =========================================================
      - name: 输出 QuantMind 最终状态
        if: always()
        run: |
          echo "========================================================="
          echo "QuantMind 最终 Docker 状态"
          echo "========================================================="

          docker ps -a \
            --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}' \
            | grep -Ei 'quantmind|quant' || docker ps -a


      # =========================================================
      # 19. 失败时输出诊断
      # =========================================================
      - name: 失败诊断
        if: failure()
        run: |
          echo "========================================================="
          echo "QuantMind GitHub Actions 失败诊断"
          echo "========================================================="

          echo ""
          echo "【Docker】"
          docker ps -a

          echo ""
          echo "【最近容器日志】"

          CONTAINER_ID=$(docker ps -a \
            --format '{{.ID}} {{.Names}}' \
            | grep -Ei 'quantmind|quant' \
            | head -1 \
            | awk '{print $1}')

          if [ -n "$CONTAINER_ID" ]; then
            docker logs --tail 200 "$CONTAINER_ID" || true
          fi

          echo ""
          echo "【推理返回】"

